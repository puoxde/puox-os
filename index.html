/* ---------- Kalender ----------
   Links: Monatsuebersicht (KW + 6 feste Zeilen), Suche, Neu/Refresh, Kalenderquellen.
   Rechts: die Woche gross, 6–22 Uhr. Die Stundenhoehe wird so gesetzt, dass 6–14 Uhr genau ins
   sichtbare Fenster passen; alles danach erreicht man durch Scrollen. */
const KAL_VON=6,KAL_BIS=22,KAL_SICHT=8;   /* Fenster 6–22 Uhr, 8 Stunden ohne Scrollen */
let kalCursor=new Date(), kmCursor=new Date(), kalSel=null, KAL_EVENTS=[], kalJetztTimer=null;
/* ISO-Kalenderwoche (Donnerstags-Regel) */
function isoKW(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7)+3);
  const first=new Date(Date.UTC(t.getUTCFullYear(),0,4));
  return 1+Math.round(((t-first)/864e5-3+((first.getUTCDay()+6)%7))/7);}
const isoDate=d=>d.toLocaleDateString('sv');
const startOfWeek=d=>{const x=new Date(d),wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const fetchEvents=(von,bis)=>fetch(`/api/kalender?von=${von}&bis=${bis}`).then(r=>r.json());
const WD_KURZ=['Mo','Di','Mi','Do','Fr','Sa','So'];
/* Uhrzeit im eingestellten Format -- der Kalender zeigt Stunden, keine Sekunden */
const stundeLabel=h=>CFG.zeitformat==12
  ?((h%12||12)+' '+(h<12?'AM':'PM'))
  :(String(h).padStart(2,'0')+':00');
const zeitLabel=hhmm=>{if(CFG.zeitformat!=12)return hhmm;
  const[h,m]=hhmm.split(':').map(Number);
  return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM');};
/* Ob ein Termin-Vorkommen e den Tag ds beruehrt (Woche und Mini-Monat teilen sich die Regel).
   Der Beginn-Tag zaehlt immer -- auch bei Dauer 0 um Mitternacht (Ende===Beginn+T00:00).
   local_events liefert je Vorkommen ein eigenes ende (Vorkommen-Tag + urspruengliche Dauer); fehlt
   es, gilt nur der Beginn-Tag. Ein Ende mit Uhrzeit zaehlt an spaeteren Tagen exklusiv ab 00:00 --
   ein Termin, der genau um Mitternacht endet, erscheint am Folgetag nicht mehr; ein Ende ohne
   Uhrzeit (ganztaegig, auch bei einem Termin mit Uhrzeit) bleibt inklusive des Enddatums. */
const evTag=(e,ds)=>{
  const beg=e.am.slice(0,10);
  if(beg===ds)return true;
  if(!e.ende)return false;
  const en=e.ende.replace(' ','T');
  return beg<ds&&(en.length<=10?en>=ds:en>ds+'T00:00');};

/* ---------- linke Spalte: Monatsuebersicht ---------- */
function renderMiniMonat(){
  const base=new Date(kmCursor);base.setDate(1);
  const y=base.getFullYear(),m=base.getMonth(),td=heute();
  $('#kmTitel').textContent=base.toLocaleDateString(REG(),{month:'long',year:'numeric'});
  const start=(new Date(y,m,1).getDay()+6)%7;
  const wochenStart=isoDate(startOfWeek(kalCursor));
  const von=isoDate(new Date(y,m,1-start)),bis=isoDate(new Date(y,m,1-start+41));
  fetchEvents(von,bis).then(k=>{
    /* mehrtaegige Termine an jedem Tag markieren, den sie abdecken -- dieselbe evTag-Regel wie in der
       Woche (Ende exklusiv um 00:00), darum direkt gegen die 42 sichtbaren Rastertage geprueft statt
       den Terminzeitraum selbst abzulaufen */
    const dniRaster=[...Array(42)].map((_,n)=>isoDate(new Date(y,m,1-start+n)));
    const hat={};(k.events||[]).forEach(e=>dniRaster.forEach(ds=>{if(evTag(e,ds))hat[ds]=true;}));
    /* Erste Spalte KW, dann M D M D F S S; immer 6 Zeilen */
    let html='<div class="wd"></div>'+['M','D','M','D','F','S','S'].map(w=>`<div class="wd">${w}</div>`).join('');
    for(let z=0;z<6;z++){
      const zeilenStart=new Date(y,m,1-start+z*7);
      html+=`<div class="kwnr">${isoKW(zeilenStart)}</div>`;
      for(let i=0;i<7;i++){
        const d=new Date(y,m,1-start+z*7+i),ds=isoDate(d);
        const fremd=d.getMonth()!==m;
        html+=`<div class="tag${fremd?' fremd':''}${hat[ds]?' hat':''}${ds===td?' heute':''}${
          isoDate(startOfWeek(d))===wochenStart?' woche':''}" data-d="${ds}">${d.getDate()}</div>`;}}
    $('#kmGrid').innerHTML=html;
    $('#kmGrid').querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{
      kalCursor=new Date(c.dataset.d+'T00:00:00');kalSel=c.dataset.d;
      renderWoche();renderMiniMonat();});});}
/* Monat/Jahr wechseln ausschliesslich ueber die beiden Pfeile */
$('#kmPrev').onclick=()=>{kmCursor.setMonth(kmCursor.getMonth()-1);renderMiniMonat();};
$('#kmNext').onclick=()=>{kmCursor.setMonth(kmCursor.getMonth()+1);renderMiniMonat();};

/* ---------- linke Spalte: Suche, Neu, Refresh, Quellen ---------- */

function renderKalQuellen(){

        renderKalQuellen();kalNeuZeichnen();renderTermine();}));
    $('#kalZuEinst').onclick=()=>zeigeTab('einstellungen');});}

/* ---------- rechte Spalte: die Woche ---------- */
const evChip=(e,extra)=>{const i=KAL_EVENTS.push(e)-1;
  const farbe=e.farbe||'#21F1A8';
  return`<div class="kev${e.quelle==='lokal'?' lokal':''}" data-ev="${i}" title="${escAttr(
      (e.am.length>10?zeitLabel(e.am.slice(11))+' ':'')+e.was+(e.ort?' · '+e.ort:''))}"
    style="background:${farbe}22;color:${farbe};border-left-color:${farbe}${extra?';'+extra:''}">${
    e.am.length>10?esc(zeitLabel(e.am.slice(11)))+' ':''}${esc(e.was)}</div>`;};
function renderWoche(){
  const mon=startOfWeek(kalCursor),sun=addDays(mon,6),td=heute();
  $('#kwTitel').textContent=`KW ${isoKW(mon)} · ${mon.toLocaleDateString(REG(),{day:'2-digit',month:'2-digit'})} – ${
    sun.toLocaleDateString(REG(),{day:'2-digit',month:'2-digit',year:'numeric'})}`;
  const tage=[...Array(7)].map((_,i)=>isoDate(addDays(mon,i)));
  /* Kopfzeile: KW-Ecke + sieben Tage. Nur der gewaehlte Tag wird markiert, heute bleibt in Akzentfarbe. */
  $('#kwKopf').innerHTML=`<div class="ecke">KW ${isoKW(mon)}</div>`+tage.map((ds,i)=>{
    const d=addDays(mon,i);
    return`<div class="tk${ds===td?' heute':''}${ds===kalSel?' gewaehlt':''}" data-d="${ds}">
      <small>${WD_KURZ[i]}</small><b>${d.getDate()}.${d.getMonth()+1}.</b></div>`;}).join('');
  return fetchEvents(tage[0],tage[6]).then(k=>{
    KAL_EVENTS=[];
    const evs=k.events||[];
    const ganz=evs.filter(e=>e.am.length<=10),timed=evs.filter(e=>e.am.length>10);
    /* mehrtaegige Termine an jedem Tag zeigen, den sie abdecken -- nicht nur am Beginn-Tag */
    let html=`<div class="kw-ganz"><div class="zeit">ganzt.</div>${tage.map(ds=>
      `<div class="zelle" data-d="${ds}">${ganz.filter(e=>evTag(e,ds)).map(e=>evChip(e)).join('')}</div>`).join('')}</div>`;
    /* Termine ausserhalb von 6–22 Uhr bekommen ihre Randstunde, damit nichts verschwindet */
    const stunde=e=>Math.max(KAL_VON,Math.min(KAL_BIS,+e.am.slice(11,13)));
    let raster='';
    for(let h=KAL_VON;h<=KAL_BIS;h++){
      raster+=`<div class="zeit">${stundeLabel(h)}</div>`;
      tage.forEach(ds=>{
        const drin=timed.filter(e=>evTag(e,ds)&&stunde(e)===h);
        raster+=`<div class="zelle${ds===td?' heute':''}${ds===kalSel?' gewaehlt':''}" data-d="${ds}" data-h="${h}">${
          drin.map((e,i)=>evChip(e,`top:${2+i*19}px`)).join('')}</div>`;});}
    $('#kwRaster').innerHTML=raster;
    /* Ganztags-Zeile sitzt ueber dem Raster, nicht darin -- sonst scrollt sie mit weg */
    const alt=$('#kwGanz');if(alt)alt.remove();
    $('#kwScroll').insertAdjacentHTML('beforebegin','<div id="kwGanz">'+html+'</div>');
    stundenHoehe();bindWoche(tage);jetztBalken(tage);
    return true;});}
/* Stundenhoehe = sichtbare Hoehe / 8, damit 6–14 Uhr ohne Scrollen sichtbar sind */

function bindWoche(tage){

/* Roter Balken auf der aktuellen Uhrzeit; der Punkt links sitzt auf der Linie des heutigen Tages */
function jetztBalken(tage){
  const alt=$('#kwJetzt');if(alt)alt.remove();
  const jetzt=new Date();
  const hhmm=jetzt.toLocaleTimeString('en-GB',{timeZone:TZ(),hour:'2-digit',minute:'2-digit',hour12:false});
  const std=+hhmm.slice(0,2)+ (+hhmm.slice(3,5))/60;
  const td=heute(),idx=tage.indexOf(td);
  if(std<KAL_VON||std>KAL_BIS+1||idx<0)return;
  const raster=$('#kwRaster'),stdh=parseFloat(getComputedStyle(raster).getPropertyValue('--stdh'))||44;
  const ganzH=($('#kwGanz')||{offsetHeight:0}).offsetHeight;
  const oben=(std-KAL_VON)*stdh;
  const spaltenBreite=(raster.clientWidth-54)/7;
  const el=document.createElement('div');
  el.className='kw-jetzt';el.id='kwJetzt';
  el.style.top=oben+'px';
  el.style.setProperty('--tagx',Math.round(idx*spaltenBreite-4)+'px');
  el.innerHTML=`<small>${esc(zeitLabel(hhmm))}</small>`;
  raster.appendChild(el);}
/* Heute: springt auf den heutigen Tag UND scrollt auf die aktuelle Uhrzeit */
function kalHeute(){
  kalCursor=new Date();kmCursor=new Date();kalSel=heute();
  renderMiniMonat();
  return renderWoche().then(()=>{
    const hhmm=new Date().toLocaleTimeString('en-GB',{timeZone:TZ(),hour:'2-digit',minute:'2-digit',hour12:false});
    const std=+hhmm.slice(0,2)+(+hhmm.slice(3,5))/60;
    const stdh=parseFloat(getComputedStyle($('#kwRaster')).getPropertyValue('--stdh'))||44;
    /* die aktuelle Stunde ins obere Drittel holen, nicht an den Rand */
    $('#kwScroll').scrollTop=Math.max(0,(std-KAL_VON-1)*stdh);});}
$('#kwHeute').onclick=kalHeute;
$('#kwPrev').onclick=()=>{kalCursor=addDays(kalCursor,-7);kmCursor=new Date(kalCursor);

$('#kwNext').onclick=()=>{kalCursor=addDays(kalCursor,7);kmCursor=new Date(kalCursor);

/* Beim Oeffnen immer heute, Uhrzeit im Bild; der rote Balken laeuft minuetlich mit */

/* ---------- Volltextsuche: Strg+K oeffnet, Pfeile waehlen, Enter oeffnet die Datei ---------- */
let suchTyp='',suchLauf=null,suchAktiv=-1,suchTreffer=[];
function suchOeffnen(vorgabe){
  $('#suchModal').hidden=false;
  const f=$('#suchFeld');
  if(vorgabe!=null)f.value=vorgabe;
  f.focus();f.select();
  suchLaden();}
function suchSchliessen(){$('#suchModal').hidden=true;}
$('#suchZu').onclick=suchSchliessen;
$('#suchFilter').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  $('#suchFilter').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  suchTyp=b.dataset.typ;suchLaden();});
function markiere(text,worte){
  let s=esc(text);
  worte.forEach(w=>{if(w.length<2)return;
    /* Suchwort wie der Text durch esc() schicken -- sonst findet ein Wort mit ' oder " den jetzt
       maskierten Text nicht mehr. Treffer-Alternative zuerst: sonst gewinnt bei einem Wort, das mit
       " oder ' beginnt, die Entitaets-Alternative und zerschneidet den Treffer. Entitaeten aus esc()
       (&quot; &apos; &lt; …) bleiben trotzdem ganz -- sonst zerschnitte „os" ein &apos; */
    s=s.replace(new RegExp('('+esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')|(&[#a-z0-9]+;)','gi'),(x,hit,ent)=>hit?'<mark>'+hit+'</mark>':ent);});
  return s;}
function suchLaden(){
  clearTimeout(suchLauf);
  const q=$('#suchFeld').value.trim();
  if(q.length<2){$('#suchListe').innerHTML='<div class="muted" style="padding:14px">Mindestens zwei Zeichen.</div>';
    $('#suchFuss').innerHTML='';suchTreffer=[];return;}
  suchLauf=setTimeout(()=>{
    fetch('/api/suche?'+new URLSearchParams({q,typ:suchTyp,limit:60})).then(r=>r.json()).then(r=>{
      suchTreffer=r.treffer||[];suchAktiv=suchTreffer.length?0:-1;
      const worte=q.toLowerCase().split(/\s+/).filter(Boolean);
      $('#suchListe').innerHTML=suchTreffer.length?suchTreffer.map((t,i)=>`
        <div class="such-treffer${i===0?' aktiv':''}" data-i="${i}">
          <div class="kopf"><b>${markiere(t.name,worte)}</b>
            ${t.gesperrt?'<span class="badge lock">🔒</span>':''}
            ${t.typ?`<span class="badge">${esc(t.typ)}</span>`:''}
            <span class="pfad">${esc(t.path)}</span></div>
          ${t.ausschnitt?`<div class="aus">${markiere(t.ausschnitt,worte)}</div>`
            :(t.gesperrt?'<div class="aus">Sperrzone — Inhalt wird nicht durchsucht, nur der Name.</div>':'')}
        </div>`).join('')
        :'<div class="muted" style="padding:14px">Nichts gefunden.</div>';
      $('#suchListe').querySelectorAll('.such-treffer').forEach(el=>{
        el.onclick=()=>suchOeffneTreffer(+el.dataset.i);});
      $('#suchFuss').innerHTML=`<span>${r.gesamt||0} Treffer</span>`
        +(r.gesperrt_nur_name?`<span>${r.gesperrt_nur_name} davon Sperrzone (nur Name)</span>`:'')
        +'<span><kbd>↑</kbd><kbd>↓</kbd> wählen</span><span><kbd>Enter</kbd> öffnen</span><span><kbd>Esc</kbd> schließen</span>';});
  },180);}
function suchOeffneTreffer(i){
  const t=suchTreffer[i];if(!t)return;
  suchSchliessen();openEditor(t.path);}
function suchBewege(d){
  if(!suchTreffer.length)return;
  suchAktiv=(suchAktiv+d+suchTreffer.length)%suchTreffer.length;
  const els=$('#suchListe').querySelectorAll('.such-treffer');
  els.forEach((e,i)=>e.classList.toggle('aktiv',i===suchAktiv));
  els[suchAktiv]?.scrollIntoView({block:'nearest'});}
$('#suchFeld').oninput=suchLaden;
$('#suchFeld').onkeydown=e=>{
  if(e.key==='ArrowDown'){e.preventDefault();suchBewege(1);}
  else if(e.key==='ArrowUp'){e.preventDefault();suchBewege(-1);}
  else if(e.key==='Enter'){e.preventDefault();suchOeffneTreffer(suchAktiv);}};
addEventListener('keydown',e=>{
  /* Strg+K wie in Obsidian; funktioniert aus jedem Tab */
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();suchOeffnen('');return;}
  if(e.key==='Escape'&&!$('#suchModal').hidden){suchSchliessen();}});

function donut(pct,color,center,cap,extra){
  const C=2*Math.PI*34, off=pct==null?C:C*(1-Math.min(1,Math.max(0,pct)));
  return`<div class="card mon"><svg viewBox="0 0 84 84">
   <circle cx="42" cy="42" r="34" fill="none" stroke="#2b2b26" stroke-width="8"/>
   <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"
     stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/>
   <text x="42" y="47" text-anchor="middle" fill="${color}" font-size="15" font-weight="700">${center}</text></svg>
   <div class="cap">${cap}</div>${extra||''}</div>`;}

/* ---------- OPNsense-Karte: liest ueber die REST-API, nicht per iframe ----------
   Die Weboberflaeche von OPNsense sendet X-Frame-Options: SAMEORIGIN und laesst sich nicht
   einbetten. Ueber die API entfaellt zudem Passwort und 2FA -- der API-Key genuegt. */
function renderOpn(){
  const wrap=$('#opnwrap');if(!wrap)return;
  wrap.innerHTML='<span class="muted">lade …</span>';
  fetch('/api/opnsense').then(r=>r.json()).then(d=>{
    if(!d.configured)return opnEinrichten(wrap);
    if(d.error){wrap.innerHTML=`<div class="card"><span class="warn">${esc(d.error)}</span>
      <div class="row" style="margin-top:10px"><button class="mini" id="opnNeu">Zugang ändern</button></div></div>`;
      $('#opnNeu').onclick=()=>opnEinrichten(wrap);return;}
    const ifs=Object.entries(d.schnittstellen||{});
    wrap.innerHTML=`<div class="cc-stats">${statTiles([
        {l:'System',v:d.firmware.name||'OPNsense'},
        {l:'Version',v:d.firmware.version||'—'},
        {l:'Schnittstellen',v:ifs.length},
        {l:'VPN-Verbindungen',v:(d.vpn||[]).length}])}</div>
      ${d.firmware.aktualisierungen?`<div class="bar" style="margin-top:12px">
        <span class="ring" style="border-color:var(--amber)"></span>
        <div><b>Firmware</b><small>${esc(String(d.firmware.aktualisierungen))}</small></div></div>`:''}
      ${d.last?`<div class="muted" style="font-size:11.5px;margin:8px 0">${esc(String(d.last))}</div>`:''}
      ${ifs.length?`<h4 class="muted" style="margin:16px 0 6px">Schnittstellen</h4>
        <div class="chips">${ifs.map(([k,v])=>`<span class="chip">${esc(k)}${v&&v!==k?' · '+esc(String(v)):''}</span>`).join('')}</div>`:''}
      ${(d.vpn||[]).length?`<h4 class="muted" style="margin:18px 0 6px">VPN — aktive Gegenstellen</h4>
        ${table(['Name','Schnittstelle','Letzter Kontakt','Empfangen','Gesendet'],
          d.vpn.map(v=>({cells:[esc(v.name),esc(v.if||'—'),esc(v.letzte||'—'),esc(v.rein||'—'),esc(v.raus||'—')]})))}`
        :'<p class="muted" style="margin-top:14px">Keine aktiven VPN-Gegenstellen gemeldet.</p>'}
      <div class="row" style="margin-top:16px"><button class="mini" id="opnAkt">⟳ Aktualisieren</button>
        <button class="mini" id="opnNeu">Zugang ändern</button>
        <button class="mini del" id="opnWeg">Verknüpfung entfernen</button></div>`;
    $('#opnAkt').onclick=()=>renderOpn();
    $('#opnNeu').onclick=()=>opnEinrichten(wrap);
    $('#opnWeg').onclick=()=>{if(confirm('OPNsense-Verknüpfung entfernen?'))
      post('/api/opnsense/remove',{}).then(()=>renderOpn());};});}
function opnEinrichten(wrap){
  fetch('/api/opnsense/status').then(r=>r.json()).then(s=>{
    wrap.innerHTML=`<div class="card" style="max-width:640px">
      <h4 style="margin-bottom:8px">OPNsense verbinden</h4>
      <div class="hinweis" style="margin-top:0">API-Key anlegen: in OPNsense unter <b>System → Zugriff → Benutzer</b>
        den Benutzer bearbeiten, unten bei <b>API-Schlüssel</b> auf <b>+</b>. OPNsense lädt eine
        <code>apikey.txt</code> herunter — sie enthält Key und Secret, und das Secret siehst du nur
        in diesem Moment. Beides wird hier DPAPI-verschlüsselt in derselben Sperrzone wie die
        Mail-Zugänge abgelegt.</div>
      <div class="frm" style="margin-top:12px">
        <div class="full"><label>Adresse</label><input id="opnUrl" value="${escAttr(s.url||'https://192.168.178.1')}" placeholder="https://opnsense.lan"></div>
        <div><label>API-Key</label><input id="opnKey" placeholder="${s.configured?'unverändert lassen: leer':''}"></div>
        <div><label>API-Secret</label><input id="opnSec" type="password" placeholder="${s.configured?'unverändert lassen: leer':''}"></div>
        <div class="full"><label>Zertifikat</label><select id="opnSsl">
          <option value="1"${s.pruefen_ssl?' selected':''}>prüfen (empfohlen)</option>
          <option value="0"${s.pruefen_ssl?'':' selected'}>nicht prüfen — nur bei selbstsigniertem Zertifikat im eigenen Netz</option>
        </select></div>

      $('#opnMsg').textContent='prüfe Verbindung …';$('#opnSave').disabled=true;
      post('/api/opnsense/setup',{url:$('#opnUrl').value.trim(),key:$('#opnKey').value.trim(),

/* ---------- Wiki-Karte: 10_wiki plus die Ordner-Indizes, die Prozesswissen tragen ---------- */

/* ---------- Explorer: kompletter Ordnerbaum des Vaults ----------
   Quelle ist /api/explorer -- nur Pfad, Groesse, Datum, kein Dateiinhalt. Typ und Sperrvermerk
   kommen aus dem ohnehin geladenen Manifest. Markdown oeffnet im Editor, alles andere wird
   nur aufgelistet (der Server liefert ausschliesslich .md an die Dateiansicht aus). */
let EXP_DATEN=null,EXP_BAUM=null,expOrdner='',expOffen=new Set(['']),expSuche='';
const expGroesse=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB'
  :b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
const expDatum=s=>new Date(s*1000).toLocaleDateString(REG(),{day:'2-digit',month:'2-digit',year:'2-digit',timeZone:TZ()});
const expEndung=p=>{const i=p.lastIndexOf('.');return i>0?p.slice(i+1).toLowerCase():'';};
function expBaumBauen(dateien){
  const wurzel={name:'',pfad:'',ordner:{},dateien:[],gesamt:0};
  dateien.forEach(f=>{
    const teile=f.path.split('/'),datei=teile.pop();
    let k=wurzel;k.gesamt++;
    teile.forEach(t=>{
      k=k.ordner[t]||(k.ordner[t]={name:t,pfad:(k.pfad?k.pfad+'/':'')+t,ordner:{},dateien:[],gesamt:0});
      k.gesamt++;});
    k.dateien.push({...f,name:datei});});
  return wurzel;}
const expOrdnerVon=pfad=>pfad.split('/').filter(Boolean)
  .reduce((k,t)=>k&&k.ordner[t],EXP_BAUM)||EXP_BAUM;
function expZweigHTML(k,tiefe){
  const kinder=Object.values(k.ordner).sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const offen=expOffen.has(k.pfad);
  let h=`<div class="exp-zweig${expOrdner===k.pfad?' on':''}" data-ordner="${escAttr(k.pfad)}"
      style="padding-left:${6+tiefe*13}px"><span class="exp-pfeil" data-auf="${escAttr(k.pfad)}"
      >${kinder.length?(offen?'▾':'▸'):'·'}</span><span>${esc(k.name||'puox')}</span><small>${k.gesamt}</small></div>`;
  if(offen)h+=kinder.map(c=>expZweigHTML(c,tiefe+1)).join('');
  return h;}
function renderExplorer(){
  const wrap=$('#expwrap');if(!wrap)return;
  if(EXP_DATEN)return expZeichnen();
  wrap.innerHTML='<span class="muted">lade …</span>';
  fetch('/api/explorer').then(r=>r.json()).then(d=>{
    EXP_DATEN=d;EXP_BAUM=expBaumBauen(d.dateien||[]);expZeichnen();});}
function expZeichnen(){
  const wrap=$('#expwrap');if(!wrap||!EXP_BAUM)return;
  /* Typ/Status/Sperrvermerk aus dem Manifest -- nur fuer Markdown vorhanden */
  const meta={};(M&&M.files||[]).forEach(f=>meta[f.path]={typ:strip(fmOf(f).typ||''),gesperrt:!!f.gesperrt});
  const k=expOrdnerVon(expOrdner);
  const such=expSuche.trim().toLowerCase();
  const zeilen=such
    ? EXP_DATEN.dateien.filter(f=>f.path.toLowerCase().includes(such)).slice(0,300)
        .map(f=>({...f,name:f.path}))
    : [...Object.values(k.ordner).sort((a,b)=>a.name.localeCompare(b.name,'de'))
        .map(o=>({ordner:o,name:o.name,path:o.pfad,bytes:null,mtime:null})),
       ...k.dateien.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))];
  const krumen=['puox',...expOrdner.split('/').filter(Boolean)];
  wrap.innerHTML=`<div class="cc-stats">${statTiles([{l:'Dateien',v:EXP_DATEN.anzahl},
      {l:'Ordner',v:Object.keys(EXP_BAUM.ordner).length},{l:'Gesamt',v:expGroesse(EXP_DATEN.bytes||0)}])}</div>
    <div class="row" style="margin:12px 0 8px">
      <input id="expSuche" placeholder="Alle Pfade durchsuchen …" autocomplete="off"
        value="${escAttr(expSuche)}" style="max-width:340px">
      <div class="exp-krume">${krumen.map((t,i)=>
        `<a href="#" data-krume="${escAttr(krumen.slice(1,i+1).join('/'))}">${esc(t)}</a>`).join('<i>/</i>')}</div></div>
    <div class="exp">
      <div class="exp-baum">${expZweigHTML(EXP_BAUM,0)}</div>
      <div class="exp-liste">${zeilen.length?`<table><tr><th>Name</th><th>Typ</th><th>Größe</th><th>Geändert</th></tr>
        ${zeilen.map(z=>{
          const md=!z.ordner&&z.path.endsWith('.md'),m=meta[z.path]||{};
          return `<tr class="${z.ordner?'exp-ord':md?'exp-md':'exp-roh'}"
            data-${z.ordner?'geh':'datei'}="${escAttr(z.path)}">
            <td>${z.ordner?'📁 ':''}${esc(z.name)}${m.gesperrt?' '+lockBadge:''}</td>
            <td>${z.ordner?'Ordner':esc(m.typ||expEndung(z.path)||'—')}</td>
            <td>${z.ordner?z.ordner.gesamt+' Dateien':expGroesse(z.bytes)}</td>
            <td>${z.mtime?esc(expDatum(z.mtime)):''}</td></tr>`;}).join('')}</table>`
        :'<p class="muted">Nichts gefunden.</p>'}
        ${such&&zeilen.length>=300?'<p class="muted" style="font-size:11px">Nur die ersten 300 Treffer.</p>':''}
      </div></div>
    <div class="hinweis">Markdown öffnet im Editor; alle anderen Dateien werden nur aufgelistet.
      Ausgenommen sind Werkzeug-Ordner und die Sperrzone mit den Zugangsdaten.</div>`;
  const neu=()=>expZeichnen();
  wrap.querySelectorAll('[data-auf]').forEach(el=>el.onclick=e=>{e.stopPropagation();
    const p=el.dataset.auf;expOffen.has(p)?expOffen.delete(p):expOffen.add(p);neu();});
  wrap.querySelectorAll('[data-ordner]').forEach(el=>el.onclick=()=>{
    expOrdner=el.dataset.ordner;expOffen.add(expOrdner);expSuche='';neu();});
  wrap.querySelectorAll('[data-geh]').forEach(el=>el.onclick=()=>{
    expOrdner=el.dataset.geh;expOffen.add(expOrdner);expSuche='';neu();});
  wrap.querySelectorAll('[data-krume]').forEach(el=>el.onclick=e=>{e.preventDefault();
    expOrdner=el.dataset.krume;expSuche='';neu();});
  wrap.querySelectorAll('tr[data-datei]').forEach(tr=>{
    if(tr.dataset.datei.endsWith('.md'))tr.onclick=()=>openEditor(tr.dataset.datei);});
  const s=$('#expSuche');
  if(s)s.oninput=()=>{expSuche=s.value;neu();
    const n=$('#expSuche');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}};}
/* Beim Oeffnen des Command Centers einmal frisch einlesen -- innerhalb des Tabs bleibt die Liste
   stehen, sonst wuerde jedes Auf-/Zuklappen im Baum den ganzen Vault neu durchlaufen.
   kundeOffen=null: ein erneuter Klick auf "Command Center" (Kopfmenue/Burger) bei schon offener
   Kundenseite soll zur Uebersicht zurueckfallen -- boot(true) nach dem Speichern laeuft
   nicht hierueber, sondern ueber den eigenen Zweig in boot() (Z. ~4121), haelt kundeOffen also. */
function renderDashboards(){kundeOffen=null;EXP_DATEN=null;DASH_PAGES=buildDashPages();ccIdx=0;renderStage();}
/* Laufender Zustand des Karussells -- ausserhalb von renderStage, damit Resize/Tabwechsel sauber aufraeumen */
let ccStop=null;
function renderStage(){
  clearInterval(monRefreshTimer);monRefreshTimer=null;
  if(ccStop){ccStop();ccStop=null;}
  const wrap=$('#ccwrap'),n=DASH_PAGES.length;
  ccIdx=((ccIdx%n)+n)%n;
  wrap.innerHTML=`<div class="cc-scene">
    <div class="cc-head"><div class="cc-kicker">Die Ausgabe-Ebene</div>
      <h1>Command Center</h1>
      <p>Kunden, Aufgaben und Systeme von uns, <b>live aus der Wissensdatenbank, ohne Umweg</b></p></div>
    <div class="cc-stage" id="ccStage">
      <div class="cc-world" id="ccWorld">
        <div class="cc-oval"></div>
        ${DASH_PAGES.map((p,i)=>`<div class="cc-card" data-i="${i}">
          <div class="cc-preview"><div class="inner">${p.html}</div></div>
          <div class="cc-card-foot"><b>${esc(p.title)}</b><small>${esc(p.desc||'')}</small></div>
        </div>`).join('')}
      </div>
      <button class="cc-arrow prev" id="pgPrev">‹</button>
      <button class="cc-arrow next" id="pgNext">›</button>
    </div>
    <div class="cc-foot" id="ccFoot">${DASH_PAGES.map(()=>'<i></i>').join('')}</div></div>`;
  const stage=$('#ccStage'),world=$('#ccWorld'),cards=[...world.querySelectorAll('.cc-card')];
  const dots=[...$('#ccFoot').children];let dotAn=-1;
  const ovals=[...world.querySelectorAll('.cc-oval')];

  /* --- Geometrie: Karten sitzen auf einem Kreis (Radius R) in Kamerahoehe, STEP Grad auseinander.
     Das Oval darunter ist derselbe Kreis, flach gelegt und um FLOOR nach unten versetzt -- deshalb
     fahren die Karten optisch exakt auf dem Oval. --- */
  const STEP=55;
  let W=0,H=0,R=0;
  function measure(){
    const b=stage.getBoundingClientRect();
    if(!b.width||!b.height)return false;
    W=Math.round(Math.max(300,Math.min(b.width*.46,b.height*1.13,780)));
    H=Math.round(W/1.45);R=Math.round(W*1.3);
    wrap.style.setProperty('--ccW',W+'px');
    wrap.style.setProperty('--ccH',H+'px');
    wrap.style.setProperty('--ccR',R+'px');
    /* scale(4) zieht das auf ein Viertel geschrumpfte Oval wieder auf seine alte Groesse.
       Zuletzt in der Kette, damit es in der bereits flach gelegten Ebene wirkt -- so ist es
       gleichbedeutend mit einem entsprechend groesseren Element, nur mit kleinerer Ebene. */
    ovals.forEach(o=>o.style.transform=`translate3d(0,${Math.round(H*.66)}px,${-R}px) rotateX(90deg) scale(4)`);
    cards.forEach(c=>{const pv=c.querySelector('.cc-preview'),inner=c.querySelector('.inner');
      const k=pv.clientWidth/820;
      inner.style.transform=`scale(${k})`;
      /* Der Karteninhalt ist so hoch, wie das Dashboard eben wird -- gemessen bis 1307 px, waehrend
         die Vorschau davon nur rund 500 px zeigt. Der Rest lag schon immer hinter
         .cc-preview{overflow:hidden}, belegte aber weiter Layout- und Rasterflaeche.
         `pv.clientHeight/k` ist genau die Inhaltshoehe, die in die Vorschau passt; weil max-height
         die Content-Box begrenzt und die 2x18 px Innenabstand oben draufkommen, bleiben rund 36 px
         Reserve ueber der Sichtkante stehen -- lieber etwas zu viel als zu wenig.
         Betrifft nur die Karussell-Vorschau: die Vollansicht baut openDashFull() eigenstaendig auf. */
      const sichtH=pv.clientHeight/k;
      inner.style.maxHeight=sichtH>0?Math.ceil(sichtH)+'px':'';   /* 0 => gar nicht begrenzen:
        ein maxHeight von 0 wuerde den Karteninhalt unsichtbar machen. Lieber keine Ersparnis
        in diesem einen Bild als eine leere Karte. */
      inner.style.overflow='hidden';});
    return true;}

  const wrapDist=(i,center)=>{let d=(i-center)%n;if(d>n/2)d-=n;if(d<-n/2)d+=n;return d;};
  /* stetige Kurven statt Stufen -- sonst springt die Optik beim Ziehen, statt fliessend mitzulaufen */
  function paintAt(center){
    cards.forEach((c,i)=>{
      const d=wrapDist(i,center),ad=Math.abs(d);
      c.style.transform=`translateZ(${-R}px) rotateY(${d*STEP}deg) translateZ(${R}px)`;
      /* max. 5 Karten sichtbar: Mitte +/-2, alles dahinter wird ausgeblendet */
      const op=Math.max(0,Math.min(1,1-ad*.32)*(ad>2?Math.max(0,3-ad):1));
      c.style.opacity=String(op);
      /* `opacity:0` allein reicht nicht: Chrome haelt fuer die Karte weiter eine eigene Ebene samt
         Filterpuffer vor. Gemessen trugen zwei der sieben Karten unsichtbar den teuersten Blur
         (7 px). `visibility:hidden` streicht Ebene, Filter und Zeichnung -- sichtbar aendert sich
         nichts, denn die Karte ist an dieser Stelle ohnehin vollstaendig durchsichtig. */
      const sicht=op>0;
      c.style.visibility=sicht?'':'hidden';
      c.classList.toggle('sichtbar',sicht);   /* traegt das will-change -- siehe .cc-stage.bewegt */
      c.style.pointerEvents=ad<1.6?'auto':'none';
      c.style.zIndex=String(20-Math.round(ad*2));
      /* gerundet -- sonst rastert der Blur jeden Frame neu; unsichtbare Karten bekommen gar keinen */
      const bl=sicht?Math.min(7,Math.round(ad*2.4)):0;
      if(c._bl!==bl){c._bl=bl;c.style.filter=bl?`blur(${bl}px)`:'';}
      c.classList.toggle('active',ad<.5);});
    const cur=((Math.round(center)%n)+n)%n;  /* gecacht -- paintAt laeuft in jedem Frame */
    if(cur!==dotAn){dots[dotAn]?.classList.remove('on');dots[cur]?.classList.add('on');dotAn=cur;}}

  /* --- Bewegung: eine Feder auf festen 8-ms-Schritten. Fixe Schrittweite = identisches Gefuehl
     bei 60, 120 oder 144 Hz; der rAF-Takt bestimmt nur, wie oft gezeichnet wird. --- */
  /* CC_PULL = Anziehung zur zentrierten Karte. Auf Wunsch um 75 % reduziert (.055 -> .0138):
     die Karte rastet deutlich weicher ein. Wert hier drehen, wenn es zu traege wirkt. */
  const CC_PULL=.0138;
  let pos=ccIdx,target=ccIdx,vel=0,acc=0,last=0,raf=null,dragging=false;
  function frame(now){
    raf=null;
    acc+=Math.min(80,now-last);last=now;
    while(acc>=8){vel=(vel+(target-pos)*CC_PULL)*.865;pos+=vel;acc-=8;}
    if(Math.abs(target-pos)<.0004&&Math.abs(vel)<.0004){
      pos=target;vel=0;ccIdx=((Math.round(target)%n)+n)%n;paintAt(pos);
      stage.classList.remove('bewegt');return;}   /* eingerastet: GPU-Ebenen wieder freigeben */
    paintAt(pos);raf=requestAnimationFrame(frame);}
  /* raf wird verworfen statt als Sperre benutzt: war das Fenster zwischendurch im Hintergrund,
     feuert der angeforderte Frame nie -- mit `if(raf)return` blieben Pfeiltasten, Mausrad und
     Karten-Klick danach dauerhaft tot */
  function run(){if(dragging)return;if(raf)cancelAnimationFrame(raf);
    stage.classList.add('bewegt');
    last=performance.now();acc=0;raf=requestAnimationFrame(frame);}
  const goTo=i=>{target=i;ccIdx=((Math.round(i)%n)+n)%n;run();};

  if(!measure()){requestAnimationFrame(()=>{if(measure())paintAt(pos);});}
  paintAt(pos);

  $('#pgPrev').onclick=()=>goTo(target-1);
  $('#pgNext').onclick=()=>goTo(target+1);

  /* --- Ziehen mit Schwung --- */
  let px=0,pt=0,startPos=0,startX=0,moved=0,card0=null,vpx=0;
  const PX_PER_CARD=430;
  stage.onpointerdown=e=>{
    /* Die Pfeil-Knoepfe liegen in der Buehne: ohne diese Ausnahme faengt setPointerCapture den
       Zeiger ab, das click-Event landet auf der Buehne statt auf dem Knopf -- Pfeile ohne Wirkung */
    if(e.button||e.target.closest('.cc-arrow'))return;
    dragging=true;moved=0;startX=px=e.clientX;pt=performance.now();vpx=0;
    stage.classList.add('bewegt');
    startPos=pos;card0=e.target.closest('.cc-card');
    if(raf){cancelAnimationFrame(raf);raf=null;}
    vel=0;stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);e.preventDefault();};
  stage.onpointermove=e=>{
    if(!dragging)return;
    const now=performance.now(),dt=Math.max(1,now-pt);
    vpx=(e.clientX-px)/dt;px=e.clientX;pt=now;
    moved=Math.max(moved,Math.abs(e.clientX-startX));
    pos=startPos-(e.clientX-startX)/PX_PER_CARD;
    if(!raf)raf=requestAnimationFrame(()=>{raf=null;paintAt(pos);});};
  const endDrag=()=>{
    if(!dragging)return;
    dragging=false;stage.classList.remove('dragging');
    if(raf){cancelAnimationFrame(raf);raf=null;}
    if(moved<6){  /* kein Ziehen, sondern ein Klick */
      pos=startPos;
      if(card0){const i=+card0.dataset.i;
        if(wrapDist(i,target)===0)openDashFull(i);else goTo(target+wrapDist(i,target));}
      else{paintAt(pos);run();}
      return;}
    /* Schwung: aus der letzten Zeigergeschwindigkeit wird ein Weiterlaufen von max. 2 Karten */
    const fling=Math.max(-2,Math.min(2,Math.round(-vpx*130/PX_PER_CARD)));
    goTo(Math.round(pos)+fling);};
  stage.onpointerup=endDrag;stage.onpointercancel=endDrag;
  stage.onlostpointercapture=endDrag;  /* Zeiger verloren (Fenster weg, Alt-Tab) -- sonst haengt der Zug */
  stage.ondragstart=e=>e.preventDefault();

  /* --- Mausrad und Pfeiltasten --- */
  let wheelLock=0;
  stage.onwheel=e=>{
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    if(Math.abs(d)<12)return;  /* Schwelle: winzige Trackpad-Zuckungen sollen nicht drehen */
    e.preventDefault();
    if(performance.now()<wheelLock)return;
    wheelLock=performance.now()+260;goTo(target+Math.sign(d));};
  const onKey=e=>{
    if(!$('#dashboards').classList.contains('on')||panelOffen())return;
    if(e.key==='ArrowLeft')goTo(target-1);
    else if(e.key==='ArrowRight')goTo(target+1);
    else if(e.key==='Enter')openDashFull(ccIdx);
    else return;
    e.preventDefault();};
  addEventListener('keydown',onKey);
  let rsz=null;
  const onResize=()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(measure())paintAt(pos);},120);};
  addEventListener('resize',onResize);
  /* Beim Abbrechen auf die Zielkarte einrasten -- sonst friert das Karussell zwischen zwei Karten ein */
  ccStop=()=>{if(raf)cancelAnimationFrame(raf);raf=null;clearTimeout(rsz);
    stage.classList.remove('bewegt');
    dragging=false;pos=target;vel=0;ccIdx=((Math.round(target)%n)+n)%n;
    removeEventListener('keydown',onKey);removeEventListener('resize',onResize);};

  DASH_PAGES.forEach((p,i)=>{if(p.after)p.after(cards[i].querySelector('.inner'));});}
function openDashFull(i){
  clearInterval(monRefreshTimer);monRefreshTimer=null;
  if(ccStop){ccStop();ccStop=null;}
  const p=DASH_PAGES[i];
  /* eigene <h2> aus dem Karten-HTML herausloesen -- sie wandert in die Kopfzeile neben den Zurueck-Button */
  const m=p.html.match(/^\s*<h2>([\s\S]*?)<\/h2>/);
  const headTxt=m?m[1]:esc(p.title);
  const bodyHtml=m?p.html.slice(m[0].length):p.html;

  const nav=(j,dir)=>n<2?'':`<button class="pg-nav ${dir}" data-go="${j}">

  const inner=$('#ccwrap').querySelector('.pg-full-inner');

let chartDept=null;
/* Teams innerhalb einer Abteilung: jedes Kind mit eigenen Unter-Agenten ist ein Team (Leitung + Mitglieder);
   Kinder ohne eigene Unter-Agenten landen gebündelt in einem Direkt-Team der Abteilung selbst */
function buildTeams(deptId,childrenOf){
  const kids=kidsOf(childrenOf,deptId);
  if(!kids.length)return[{leadId:deptId,agents:[deptId],direct:true}];
  const teams=[],direct=[];
  kids.forEach(k=>{const sub=kidsOf(childrenOf,k);
    if(sub.length)teams.push({leadId:k,agents:[k,...subtreeAll(k,childrenOf)]});
    else direct.push(k);});
  if(direct.length)teams.push({leadId:deptId,agents:direct,direct:true});
  return teams;
}

function renderChart(){
  const wrap=$('#chartwrap');
  if(!wrap)return;
  if(!DEPTS.length){wrap.innerHTML='<span class="muted">Abteilungen werden geladen …</span>';return;}
  chartDept=chartDept&&DEPTS.includes(chartDept)?chartDept:DEPTS[0];

  const inTeam=new Set();
  const teams=leads.map(l=>{

    mit.forEach(x=>inTeam.add(x));

  const rest=list.filter(a=>!inTeam.has(a.id));
  if(rest.length)teams.push({lead:null,agents:rest.map(a=>a.id)});
  $('#chbody').innerHTML=`<h3 style="margin-bottom:2px">${esc(a0.name||chartDept)} · der KI-Rollout</h3>
    <div class="muted" style="margin-bottom:10px">${auto} von ${list.length} Agenten fully autonomous</div>

      return`<div class="ch-team"><h4>${label}${sub?' <small class="muted">— '+esc(sub)+'</small>':''}</h4>
        ${tierBoardHTML(tlist)}</div>`;}).join('')

/* ---------- PIN-Eingabe: Ziffern UND Buchstaben, aber nichts wird angezeigt ----------
   Das Feld bleibt dauerhaft leer (auch keine Punkte/Sterne) -- der Platzhalter steht durchgehend da.
   Der echte Wert liegt in einer WeakMap, nicht im DOM: ein data-Attribut waere im Inspector lesbar.
   Damit man merkt, dass ein Anschlag ankam, blitzt der Rahmen kurz auf -- ohne die Laenge zu verraten. */
const PINS=new WeakMap();
const pinWert=el=>PINS.get(el)||'';
function pinFeld(el){
  PINS.set(el,'');
  el.type='text';el.value='';
  el.setAttribute('autocomplete','off');el.setAttribute('spellcheck','false');
  el.classList.add('pinfeld');
  const puls=()=>{el.classList.remove('tippt');void el.offsetWidth;el.classList.add('tippt');
    el.dispatchEvent(new Event('pin'));};
  el.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key==='Tab')return;
    if((e.ctrlKey||e.metaKey)&&['v','V','a','A','c','C','x','X'].includes(e.key))return;
    e.preventDefault();
    const alt=pinWert(el);
    if(e.key==='Backspace')PINS.set(el,alt.slice(0,-1));
    else if(e.key==='Delete'||e.key==='Escape')PINS.set(el,'');
    else if(e.key.length===1)PINS.set(el,(alt+e.key).slice(0,32));
    else return;
    el.value='';puls();});
  el.addEventListener('paste',e=>{
    e.preventDefault();
    const t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/[\s\u0000-\u001f]/g,'');
    PINS.set(el,(pinWert(el)+t).slice(0,32));el.value='';puls();});
  /* Falls doch etwas ins Feld gelangt (Autofill, Diktat): sofort in den Puffer und Feld leeren */
  el.addEventListener('input',()=>{
    if(el.value){PINS.set(el,(pinWert(el)+el.value).replace(/[\s\u0000-\u001f]/g,'').slice(0,32));el.value='';puls();}});
  return ()=>pinWert(el);}
/* Auto-Anmeldung: 600 ms nach dem letzten Anschlag (ab 4 Zeichen) wird still geprueft; passt sie, ist man
   drin -- ohne Bestaetigen. Nicht mehr bei jedem Anschlag: das waeren Fehlversuche fuer die PIN-Bremse.
   Der Entsperren-Knopf bleibt fuer den Fall, dass man ihn doch drueckt. */
function pinAutoUnlock(el,msgSel,onOk){
  let busy=false,last='',warte=null;
  const probe=()=>{
    const pin=pinWert(el);
    if(busy||pin===last||!/^[^\s]{4,32}$/.test(pin))return;
    busy=true;last=pin;
    post('/api/mail/unlock',{pin}).then(r=>{
      busy=false;
      if(r.error){$(msgSel).textContent='';return;}
      $(msgSel).textContent='';
      MAIL_TOKEN=r.token;sessionStorage.setItem('mailToken',MAIL_TOKEN);onOk();});};
  const force=()=>{
    clearTimeout(warte);last='';
    const pin=pinWert(el);
    if(!/^[^\s]{4,32}$/.test(pin)){$(msgSel).textContent='PIN: 4 bis 32 Zeichen';return;}
    post('/api/mail/unlock',{pin}).then(r=>{
      if(r.error){$(msgSel).textContent=r.error;return;}
      MAIL_TOKEN=r.token;sessionStorage.setItem('mailToken',MAIL_TOKEN);onOk();});};
  el.addEventListener('pin',()=>{clearTimeout(warte);warte=setTimeout(probe,600);});
  el.onkeydown=e=>{if(e.key==='Enter')force();};
  return force;}

  mailGriffAktiv();

const mailHauptkonto=()=>(mailFolder&&mailFolder.account)

const mailAktKonto=()=>(mailFolder&&mailFolder.account)||mailHauptkonto();
function mailOrdnerAnlegen(acct){
  if(!acct)return alert('Kein Postfach gewählt');
  const n=prompt('Name des neuen Ordners (Unterordner mit / trennen, z.B. Projekte/2026):');
  if(!n||!n.trim())return;
  post('/api/mail/folder',{token:MAIL_TOKEN,op:'create',account:acct,name:n.trim()}).then(r=>{
    if(r.error){alert('Ordner: '+r.error);return;}
    mailLadeOrdner(true);});}
/* Ziehbare Trennlinie zwischen Ordnerbaum und Nachrichtenliste */
function mailGriffAktiv(){
  const griff=$('#mailGriff'),grid=$('#mail3');if(!griff||!grid)return;
  let start=0,startB=0;
  griff.onpointerdown=e=>{
    start=e.clientX;startB=mailBreite;griff.setPointerCapture(e.pointerId);
    griff.classList.add('zieht');e.preventDefault();};
  griff.onpointermove=e=>{
    if(!griff.classList.contains('zieht'))return;
    mailBreite=Math.max(150,Math.min(520,startB+(e.clientX-start)));
    grid.style.gridTemplateColumns=`${mailBreite}px 320px minmax(0,1fr)`;};
  const stop=()=>{if(!griff.classList.contains('zieht'))return;
    griff.classList.remove('zieht');localStorage.setItem('mailBreite',mailBreite);};
  griff.onpointerup=stop;griff.onpointercancel=stop;griff.onlostpointercapture=stop;}
function mailLadeOrdner(behalten){
  fetch('/api/mail/status').then(r=>r.json()).then(s=>{
    if(s.error)return s.auth?mailAuthFail(s.error):alert(s.error);
    mailAccounts=s.accounts||[];
    Promise.all(mailAccounts.map(a=>mailApi('/api/mail/folders',{account:a.id})
      .then(r=>({account:a,folders:r.folders||[],error:r.error||null,auth:!!r.auth}))))
    .then(groups=>{
      /* abgelaufener/ungueltiger Mail-Token: einmal fuer alle Postfaecher melden statt je Ordner "gesperrt" */
      const auth=groups.find(g=>g.auth);
      if(auth)return mailAuthFail(auth.error);
      mailPaintTree(groups);
      if(behalten||mailFolder)return;
      /* Beim Oeffnen zuerst das Hauptpostfach aus den Einstellungen, sonst das erste */
      const haupt=groups.find(g=>!g.error&&g.account.id===CFG.hauptpostfach&&g.folders.length);
      const first=haupt||groups.find(g=>!g.error&&g.folders.length);
      if(first){const waehlbar=first.folders.filter(f=>f.auswaehlbar!==false);
        const inbox=waehlbar.find(f=>/^(inbox|posteingang)$/i.test(f.name))||waehlbar[0];
        if(inbox)mailOpenFolder(first.account.id,inbox.name);}});});}
/* Ordnerbaum: alle Ordner, Unterordner nach Ebene eingerueckt. Der Abo-Umschalter ist raus --
   der Abgleich abonniert ohnehin alles (server.py: _alle_abonnieren). */
function mailPaintTree(groups){
  const el=$('#mailFolders');if(!el)return;
  el.innerHTML=groups.map(g=>{
    const aid=g.account.id,zu=mailZu.includes(aid);
    return`<div class="mail-acct${zu?' zu':''}" data-acct="${escAttr(aid)}">
      <div class="mail-acct-head" data-toggle="${escAttr(aid)}" title="${escAttr(g.account.email)}">
        <span class="caret">▼</span><span class="nm">${esc(g.account.label)}</span></div>
      <div class="mail-acct-body">
      ${g.error?`<div class="mail-acct-err">${esc(g.error)}</div>`:g.folders.map(f=>`
        <div class="mail-fold${f.auswaehlbar===false?' nichtwaehlbar':''}${f.tiefe?' tief':''}" style="--tiefe:${f.tiefe||0}">
          <button class="f" data-acct="${escAttr(aid)}" data-n="${escAttr(f.name)}"
            title="${escAttr(f.name)}"${f.auswaehlbar===false?' disabled':''}>${esc(f.kurz||f.name)}</button>
          <button class="fx" data-sub="${escAttr(f.name)}" data-acct="${escAttr(aid)}" title="Unterordner anlegen">＋</button>
          <button class="fx" data-ren="${escAttr(f.name)}" data-acct="${escAttr(aid)}" title="Umbenennen">✎</button>
          <button class="fx" data-del="${escAttr(f.name)}" data-acct="${escAttr(aid)}" title="Löschen">🗑</button>
        </div>`).join('')}
      </div></div>`;}).join('');
  el.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=()=>{
    const id=h.dataset.toggle;
    mailZu=mailZu.includes(id)?mailZu.filter(x=>x!==id):[...mailZu,id];
    mailSpeichereZu();h.closest('.mail-acct').classList.toggle('zu');});
  el.querySelectorAll('button.f[data-n]').forEach(b=>b.onclick=()=>mailOpenFolder(b.dataset.acct,b.dataset.n));
  const op=(d,ok)=>post('/api/mail/folder',{token:MAIL_TOKEN,...d}).then(r=>{
    if(r.error){alert('Ordner: '+r.error);return;}
    if(ok)ok();mailLadeOrdner(true);});
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    const n=prompt('Name des Unterordners in „'+b.dataset.sub+'“:');
    if(n&&n.trim())op({op:'create',account:b.dataset.acct,name:b.dataset.sub+'/'+n.trim()});});
  el.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{
    const n=prompt('Neuer Name für „'+b.dataset.ren+'“:',b.dataset.ren);
    if(n&&n.trim()&&n!==b.dataset.ren)op({op:'rename',account:b.dataset.acct,name:b.dataset.ren,neu:n.trim()});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Ordner „'+b.dataset.del+'“ mit allen Nachrichten löschen?'))return;
    op({op:'delete',account:b.dataset.acct,name:b.dataset.del},()=>{
      if(mailFolder&&mailFolder.name===b.dataset.del)mailFolder=null;});});
  el.querySelectorAll('button.f[data-n]').forEach(b=>b.classList.toggle('on',
    !!mailFolder&&b.dataset.acct===mailFolder.account&&b.dataset.n===mailFolder.name));}

/* Flags: Stern und gelesen/ungelesen. `flag` ohne Backslash -- den setzt der Server (api_mail_flag). */
/* f = Ordner der Nachricht (mailOpenMessage reicht ihn durch) -- UIDs gelten nur je Ordner */
function mailSetFlag(uid,flag,an,f=mailFolder){
  const m=mailMessages.find(x=>x.uid===uid);if(!m)return;
  if(flag==='Flagged')m.flagged=an;else if(flag==='Seen')m.seen=an;
  mailPaintList();
  post('/api/mail/flag',{token:MAIL_TOKEN,account:f.account,folder:f.name,uid,flag,on:an})
    .then(r=>{if(r&&r.error)r.auth?mailAuthFail(r.error):alert(r.error);});}
function mailDownloadAttachment(uid,idx,filename,f=mailFolder){
  fetch(`/api/mail/attachment?${new URLSearchParams({token:MAIL_TOKEN||'',account:f.account,folder:f.name,uid,idx})}`)
    .then(r=>r.ok?r.blob():r.json().then(d=>Promise.reject(d)))
    .then(b=>{const url=URL.createObjectURL(b);
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);})
    .catch(d=>d&&d.auth?mailAuthFail(d.error):alert((d&&d.error)||'Anhang konnte nicht geladen werden'));}

    $('#mailStar').onclick=()=>{const an=!m.flagged;mailSetFlag(uid,'Flagged',an,f);

        if(r.error)return r.auth?mailAuthFail(r.error):alert(r.error);

/* Selbst installierte Schriften (97_puoxos/schriften). Sie stehen gleichberechtigt in denselben
   Auswahllisten; @font-face wird beim Laden erzeugt, damit sie ueberall greifen. */
let SCHRIFTEN=[];

const fontCSS=n=>SCHRIFTEN.some(s=>s.name===n)?'"'+String(n).replace(/"/g,'')+'"':n;
function schriftenAnwenden(liste){

      <small class="muted" id="einMailMsg"></small></div></div>`;
  const addBtn=$('#emAdd');if(addBtn)addBtn.onclick=()=>mailOpenAddAccount();
  $('#emGoMail').onclick=()=>zeigeTab('mail');
  bindSpeichern($('#einMail'),'einMailMsg');}
/* ---------- Kalender-Bereich: Hauptkalender + beliebig viele Zusatzkalender ---------- */
function renderEinKal(th){
  th=thSammle();   /* wie einMailList: aktueller Stand statt des th vom Oeffnen */
  fetch('/api/kalender/status').then(r=>r.json()).then(s=>{
    const liste=s.kalender||[];
    $('#einKal').innerHTML=`<div class="card">
      <div class="frm">
        <div class="full"><label>Hauptkalender</label><select id="einHauptKal">
          <option value="">— erster Kalender —</option>
          ${liste.map(k=>`<option value="${escAttr(k.id)}"${th.hauptkalender===k.id?' selected':''}>${esc(k.name)}</option>`).join('')}</select></div>
      </div>
      <div class="hinweis">Neue Termine landen immer lokal in PUOX-OS. Der Hauptkalender ist der,
        dessen Termine als erstes gelten, wenn mehrere dieselbe Zeit belegen.</div>
      <div class="row" style="margin-top:8px"><button class="act" data-save="1">Speichern</button>
        <small class="muted" id="einKalMsg"></small></div>
      <h4 style="margin:18px 0 8px">Verknüpfte Kalender</h4>
      <div id="kalListe">${liste.length?liste.map(k=>`<div class="kal-zeile" data-id="${escAttr(k.id)}">
          <span class="kal-punkt" style="background:${escAttr(k.farbe)}"></span>
          <b>${esc(k.name)}</b>
          <small class="muted">${esc(k.url.slice(0,58))}${k.url.length>58?'…':''}</small>
          <button class="mini" data-an="${k.an?'0':'1'}">${k.an?'sichtbar':'ausgeblendet'}</button>
          <button class="mini" data-edit="1">Bearbeiten</button>
          <button class="mini del" data-del="1">Entfernen</button>
        </div>`).join(''):'<span class="muted">Noch kein Kalender verknüpft.</span>'}</div>
      <div id="kalForm" hidden></div>
      <div class="row" style="margin-top:10px"><button class="mini" id="kalNeu">+ Kalender hinzufügen</button></div>
    </div>`;
    bindSpeichern($('#einKal'),'einKalMsg');
    $('#kalNeu').onclick=()=>kalFormular(null);
    $('#kalListe').querySelectorAll('.kal-zeile').forEach(z=>{
      const id=z.dataset.id,k=liste.find(x=>x.id===id);
      z.querySelector('[data-an]').onclick=()=>post('/api/kalender/toggle',{id,an:z.querySelector('[data-an]').dataset.an==='1'})
        .then(()=>{renderEinKal(th);renderTermine();if($('#kalender').classList.contains('on'))kalNeuZeichnen();});
      z.querySelector('[data-edit]').onclick=()=>kalFormular(k);
      z.querySelector('[data-del]').onclick=()=>{
        if(!confirm('Kalender „'+k.name+'“ entfernen?'))return;
        post('/api/kalender/remove',{id}).then(()=>{renderEinKal(th);renderTermine();
          if($('#kalender').classList.contains('on'))kalNeuZeichnen();});};});
    function kalFormular(k){
      const f=$('#kalForm');f.hidden=false;
      f.innerHTML=`<div class="mfset" style="margin-top:12px"><h4>${k?'Kalender bearbeiten':'Neuer Kalender'}</h4>
        <div class="frm">
          <div><label>Name</label><input id="kaName" value="${escAttr(k?k.name:'')}" placeholder="z.B. Geschäftlich"></div>
          <div><label>Farbe</label><input id="kaFarbe" type="color" value="${escAttr(k?k.farbe:'#66B8FF')}" style="height:34px;padding:2px"></div>
          <div class="full"><label>Kalender-URL (ICS/CalDAV)</label><input id="kaUrl" value="${escAttr(k?k.url:'')}" placeholder="https://kalender.example.com/…"></div>
          <div><label>Benutzername</label><input id="kaUser" value="${escAttr(k?k.username:'')}"></div>
          <div><label>Passwort</label><input id="kaPass" type="password" placeholder="${k?'leer lassen = unverändert':''}"></div>
        </div>
        <div class="hinweis">Zugangsdaten liegen DPAPI-verschlüsselt in derselben Sperrzone wie die
          Mail-Postfächer — Agenten haben keinen Zugriff.</div>
        <div class="row" style="margin-top:8px"><button class="act" id="kaSave">Verknüpfen &amp; testen</button>
          <button class="mini" id="kaAbbruch">Abbrechen</button><small class="muted" id="kaMsg"></small></div></div>`;
      $('#kaAbbruch').onclick=()=>{f.hidden=true;f.innerHTML='';};
      $('#kaSave').onclick=()=>{
        $('#kaMsg').textContent='prüfe Zugangsdaten …';$('#kaSave').disabled=true;
        post('/api/kalender/setup',{id:k?k.id:'',name:$('#kaName').value.trim(),farbe:$('#kaFarbe').value,
          url:$('#kaUrl').value.trim(),username:$('#kaUser').value.trim(),password:$('#kaPass').value,an:true}).then(r=>{
          $('#kaSave').disabled=false;
          if(r.error){$('#kaMsg').textContent=r.error;return;}
          renderEinKal(th);renderTermine();
          if($('#kalender').classList.contains('on'))kalNeuZeichnen();});};}
  });}

/* ---------- Chat-Tab: Matrix-Client, direkt gegen den Homeserver (CORS ist im Standard vorgeschrieben)
   KEINE Ende-zu-Ende-Verschluesselung. Die braucht libolm + Geraeteverifikation + Key-Backup --
   selbstgebaute Krypto ist genau die Stelle, an der man es nicht selbst macht. Verschluesselte Raeume
   werden erkannt und angezeigt, aber nicht entschluesselt; dafuer bleibt Element das Werkzeug. ---------- */
let MX=JSON.parse(localStorage.getItem('mxSession')||'null');
let MXS={rooms:{},cur:null,since:null,stop:false,laeuft:false,ungelesen:0};
const mxSpeichern=()=>MX?localStorage.setItem('mxSession',JSON.stringify(MX)):localStorage.removeItem('mxSession');
const mxUrl=(p,q)=>MX.hs.replace(/\/+$/,'')+'/_matrix/client/v3'+p+(q?'?'+new URLSearchParams(q):'');
const mxFetch=(p,q,opt)=>fetch(mxUrl(p,q),{...opt,
  headers:{'Authorization':'Bearer '+MX.token,'Content-Type':'application/json',...(opt&&opt.headers)}})
  .then(r=>r.json());
function renderChat(){
  MXS.stop=false;
  if(!MX||!MX.token)return mxLogin();
  mxClient();}
function mxLogin(msg){
  $('#chatwrap').innerHTML=`<div class="mx-login"><div class="box">
    <h3>Matrix-Konto verbinden</h3>
    <div class="muted" style="font-size:11px">Passwort geht direkt an deinen Homeserver — PUOX-OS speichert
      nur den Zugangs-Token, nie das Passwort.</div>
    <div class="frm">
      <div class="full"><label>Homeserver</label><input id="mxHs" value="https://matrix.org" placeholder="https://matrix.org"></div>
      <div class="full"><label>Benutzer</label><input id="mxUser" placeholder="@name:matrix.org oder name"></div>
      <div class="full"><label>Passwort</label><input id="mxPass" type="password"></div>
    </div>
    <div class="row"><button class="act" id="mxGo">Anmelden</button><small class="muted" id="mxMsg">${esc(msg||'')}</small></div>
  </div></div>`;
  const go=()=>{
    const hs=$('#mxHs').value.trim().replace(/\/+$/,'');
    if(!/^https?:\/\//.test(hs)){$('#mxMsg').textContent='Homeserver muss mit https:// beginnen';return;}
    $('#mxMsg').textContent='melde an …';$('#mxGo').disabled=true;
    const u=$('#mxUser').value.trim();
    fetch(hs+'/_matrix/client/v3/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'m.login.password',
        identifier:{type:'m.id.user',user:u.replace(/^@/,'').split(':')[0]},
        password:$('#mxPass').value,initial_device_display_name:'97_puoxos'})})
      .then(r=>r.json()).then(r=>{
        $('#mxGo').disabled=false;
        if(!r.access_token){$('#mxMsg').textContent=r.error||'Anmeldung fehlgeschlagen';return;}
        MX={hs,token:r.access_token,userId:r.user_id,device:r.device_id};mxSpeichern();
        MXS={rooms:{},cur:null,since:null,stop:false,laeuft:false,ungelesen:0};
        if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
        mxClient();})
      .catch(e=>{$('#mxGo').disabled=false;
        $('#mxMsg').textContent='Homeserver nicht erreichbar ('+e.message+')';});};
  $('#mxGo').onclick=go;
  $('#mxPass').onkeydown=e=>{if(e.key==='Enter')go();};}
function mxClient(){
  $('#chatwrap').innerHTML=`<div class="mx">
    <div class="mx-side">
      <div class="mx-head"><b>${esc(MX.userId||'')}</b><button class="mini" id="mxOut" style="margin-left:auto">Abmelden</button></div>
      <div class="mx-rooms" id="mxRooms"><div class="muted" style="padding:10px">verbinde …</div></div>
    </div>
    <div class="mx-main">
      <div class="mx-title" id="mxTitle"><b>Kein Raum gewählt</b></div>
      <div class="mx-log" id="mxLog"></div>
      <div class="mx-send"><input id="mxIn" placeholder="Nachricht …" disabled>
        <button class="act" id="mxSend" disabled>Senden</button></div>
    </div></div>`;
  $('#mxOut').onclick=()=>{MXS.stop=true;
    mxFetch('/logout',null,{method:'POST',body:'{}'}).catch(()=>{});
    MX=null;mxSpeichern();mxBadge(0);mxLogin('abgemeldet');};
  const senden=()=>{
    const t=$('#mxIn').value.trim();if(!t||!MXS.cur)return;
    $('#mxIn').value='';
    const txn='puox'+Date.now();
    mxFetch('/rooms/'+encodeURIComponent(MXS.cur)+'/send/m.room.message/'+txn,null,
      {method:'PUT',body:JSON.stringify({msgtype:'m.text',body:t})})
      .then(r=>{if(r.errcode)mxAnhaengen(MXS.cur,{sys:true,txt:'Senden fehlgeschlagen: '+(r.error||r.errcode)});});};
  $('#mxSend').onclick=senden;
  $('#mxIn').onkeydown=e=>{if(e.key==='Enter')senden();};
  /* Zwischenstand sofort zeigen -- ein laufender /sync haengt bis zu 30 s am Server */
  mxPaintRooms();
  if(MXS.cur&&MXS.rooms[MXS.cur])mxOeffnen(MXS.cur);
  mxSync();}
function mxRaumName(r){
  return r.name||r.alias||(r.mitglieder&&r.mitglieder.length?r.mitglieder.slice(0,3).join(', '):r.id);}
function mxPaintRooms(){
  const el=$('#mxRooms');if(!el)return;
  const liste=Object.values(MXS.rooms).sort((a,b)=>(b.zuletzt||0)-(a.zuletzt||0));
  el.innerHTML=liste.length?liste.map(r=>`<div class="mx-room${r.id===MXS.cur?' on':''}" data-r="${escAttr(r.id)}">
      <span class="rn">${r.krypto?'🔒 ':''}${esc(mxRaumName(r))}</span>
      ${r.neu?`<span class="cnt">${r.neu}</span>`:''}</div>`).join('')
    :'<div class="muted" style="padding:10px">keine Räume</div>';
  el.querySelectorAll('[data-r]').forEach(d=>d.onclick=()=>mxOeffnen(d.dataset.r));
  MXS.ungelesen=liste.reduce((s,r)=>s+(r.neu||0),0);mxBadge(MXS.ungelesen);}
function mxBadge(n){
  const b=document.querySelector('nav button[data-tab="chat"]');if(!b)return;
  b.innerHTML='Chat'+(n?`<span class="badge2">${n}</span>`:'');}
function mxOeffnen(id){
  MXS.cur=id;const r=MXS.rooms[id];if(r)r.neu=0;
  mxPaintRooms();
  /* Chat-Tab noch nicht gezeichnet (Hintergrund-Sync ab Start): mxClient oeffnet den Raum spaeter. Der
     Wurf hier brach den ersten /sync ab, `since` blieb leer, und der Neuversuch haengte den Verlauf doppelt an. */
  if(!$('#mxTitle'))return;
  $('#mxTitle').innerHTML=`<b>${esc(mxRaumName(r||{id}))}</b><small>${r&&r.thema?esc(r.thema):''}</small>`;
  $('#mxIn').disabled=false;$('#mxSend').disabled=false;$('#mxIn').focus();
  mxPaintLog();}
function mxPaintLog(){
  const el=$('#mxLog'),r=MXS.rooms[MXS.cur];if(!el||!r)return;
  const nah=el.scrollTop+el.clientHeight>=el.scrollHeight-60;
  const reg=(MX&&MX.region)||'de-DE';
  el.innerHTML=(r.krypto?`<div class="mx-msg sys">🔒 Ende-zu-Ende-verschlüsselter Raum — PUOX-OS kann die Inhalte
      nicht lesen. Zum Mitlesen/Antworten: derselbe Raum in Element.</div>`:'')
    +(r.log||[]).map(m=>m.sys?`<div class="mx-msg sys">${esc(m.txt)}</div>`
      :`<div class="mx-msg${m.wer===MX.userId?' mine':''}">
         <span class="who" title="${escAttr(m.wer)}">${esc((m.wer||'').replace(/^@/,'').split(':')[0])}</span>
         <span class="txt">${esc(m.txt)}</span>
         <span class="ts">${m.ts?esc(new Date(m.ts).toLocaleTimeString(reg,{hour:'2-digit',minute:'2-digit'})):''}</span></div>`).join('');
  if(nah)el.scrollTop=el.scrollHeight;}
function mxAnhaengen(rid,msg){
  const r=MXS.rooms[rid];if(!r)return;
  (r.log=r.log||[]).push(msg);
  if(r.log.length>300)r.log.splice(0,r.log.length-300);
  if(rid===MXS.cur)mxPaintLog();}
/* Long-Poll-Schleife: /sync blockt bis zu 30 s beim Server und kommt mit den Neuigkeiten zurueck */
function mxSync(){
  if(MXS.laeuft||MXS.stop||!MX)return;
  /* Generation = das MXS-Objekt: ein Login ersetzt es. Kommt danach noch die Antwort der alten Schleife
     (alter Token, nach /logout M_UNKNOWN_TOKEN), verfaellt sie -- sonst warf sie die neue Sitzung weg. */
  const gen=MXS;
  MXS.laeuft=true;
  const q={timeout:MXS.since?30000:0};
  if(MXS.since)q.since=MXS.since;
  else q.filter=JSON.stringify({room:{timeline:{limit:40}}});
  mxFetch('/sync',q).then(d=>{
    if(gen!==MXS)return;
    MXS.laeuft=false;
    if(MXS.stop)return;
    if(d.errcode==='M_UNKNOWN_TOKEN'||d.errcode==='M_MISSING_TOKEN'){
      MX=null;mxSpeichern();return mxLogin('Sitzung abgelaufen — bitte neu anmelden');}
    if(d.next_batch){mxVerarbeite(d);MXS.since=d.next_batch;}
    if($('#chat').classList.contains('on')||MXS.since)setTimeout(mxSync,d.next_batch?0:4000);
  }).catch(()=>{if(gen!==MXS)return;MXS.laeuft=false;if(!MXS.stop)setTimeout(mxSync,6000);});}
function mxVerarbeite(d){
  const join=(d.rooms&&d.rooms.join)||{},erste=!MXS.since;
  Object.entries(join).forEach(([rid,rm])=>{
    const r=MXS.rooms[rid]=MXS.rooms[rid]||{id:rid,log:[],neu:0,mitglieder:[]};
    [...((rm.state&&rm.state.events)||[]),...((rm.timeline&&rm.timeline.events)||[])].forEach(ev=>{
      if(ev.type==='m.room.name')r.name=ev.content&&ev.content.name;
      else if(ev.type==='m.room.topic')r.thema=ev.content&&ev.content.topic;
      else if(ev.type==='m.room.canonical_alias')r.alias=ev.content&&ev.content.alias;
      else if(ev.type==='m.room.encryption')r.krypto=true;
      else if(ev.type==='m.room.member'&&ev.content&&ev.content.membership==='join'){
        const n=ev.content.displayname||ev.state_key;
        if(n&&ev.state_key!==MX.userId&&!r.mitglieder.includes(n))r.mitglieder.push(n);}});
    ((rm.timeline&&rm.timeline.events)||[]).forEach(ev=>{
      let msg=null;
      if(ev.type==='m.room.message'&&ev.content)
        msg={wer:ev.sender,ts:ev.origin_server_ts,txt:ev.content.body||'('+(ev.content.msgtype||'?')+')'};
      else if(ev.type==='m.room.encrypted')
        msg={wer:ev.sender,ts:ev.origin_server_ts,txt:'🔒 verschlüsselte Nachricht'};
      if(!msg)return;
      r.zuletzt=Math.max(r.zuletzt||0,ev.origin_server_ts||0);
      r.log.push(msg);
      if(r.log.length>300)r.log.splice(0,r.log.length-300);
      if(!erste&&rid!==MXS.cur&&ev.sender!==MX.userId){
        r.neu=(r.neu||0)+1;mxBenachrichtige(r,msg);}});
    if(!r.zuletzt)r.zuletzt=1;});
  mxPaintRooms();
  if(MXS.cur)mxPaintLog();
  else{const ersterRaum=Object.values(MXS.rooms).sort((a,b)=>(b.zuletzt||0)-(a.zuletzt||0))[0];
    if(ersterRaum)mxOeffnen(ersterRaum.id);}}
function mxBenachrichtige(r,msg){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const n=new Notification(mxRaumName(r),{body:msg.txt.slice(0,140),tag:r.id});
    n.onclick=()=>{window.focus();document.querySelector('nav button[data-tab="chat"]').click();mxOeffnen(r.id);};
  }catch(_){}}

/* ---------- Weltall-Hintergrund: langsam driftende Sterne mit leichtem Glow ----------
   Der Glow kommt aus einem vorgerenderten Sprite -- ctx.shadowBlur pro Stern kostet zu viel. */
(function stars(){
  const cv=$('#space'),ctx=cv.getContext('2d');
  const sprite=document.createElement('canvas');sprite.width=sprite.height=32;
  const sc=sprite.getContext('2d'),gr=sc.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba(255,253,247,1)');gr.addColorStop(.16,'rgba(233,227,213,.8)');
  gr.addColorStop(.42,'rgba(233,227,213,.16)');gr.addColorStop(1,'rgba(233,227,213,0)');
  sc.fillStyle=gr;sc.fillRect(0,0,32,32);
  let W=0,H=0;const S=[];
  const mk=()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.2,a:.2+Math.random()*.45,
    vx:(Math.random()-.5)*.014,vy:(Math.random()-.5)*.014,ph:Math.random()*6.283});
  function size(){const dpr=Math.min(2,devicePixelRatio||1);
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(60,Math.min(240,Math.round(W*H/12000)));
    while(S.length<n)S.push(mk());
    S.length=n;}
  let last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    /* Bildtakt auf 30/s gedeckelt. Die Sterne driften mit hoechstens 7 px/s und funkeln mit 0,6 Hz --
       je Bild sind das 0,23 px Versatz und 1/50 Funkelperiode, beides unterhalb der Sichtbarkeit.
       Auf einem 144-Hz-Schirm entfallen damit rund vier Fuenftel der Vollbild-Repaints.
       `last` bleibt bei uebersprungenen Bildern unangetastet: dt traegt so die echte verstrichene
       Zeit, die Drift laeuft unveraendert schnell -- nur eben in groesseren Schritten. */
    if(now-last<RUHE_MS)return;
    const dt=Math.min(60,now-last);last=now;
    if(W!==innerWidth||H!==innerHeight)size();  /* faengt auch den Fall "Layout beim Start noch 0" ab */
    /* Ein Vollbild-Repaint pro Bild ist der teuerste Einzelposten der Seite. Er entfaellt, sobald
       das deckende Abteilungs-Vollbild davorliegt oder der Bildhintergrund die Sterne ausblendet
       (`html.bild-bg #space{display:none}`) -- in beiden Faellen sieht sie ohnehin niemand. */
    if(!document.hidden&&W&&!deptDeckt()&&!document.documentElement.classList.contains('bild-bg')){
      ctx.clearRect(0,0,W,H);
      const t=now/1000;
      S.forEach(s=>{
        s.x+=s.vx*dt;s.y+=s.vy*dt;
        if(s.x<-8)s.x=W+8;else if(s.x>W+8)s.x=-8;
        if(s.y<-8)s.y=H+8;else if(s.y>H+8)s.y=-8;
        const k=s.r*4.2;
        ctx.globalAlpha=s.a*(.72+.28*Math.sin(t*.6+s.ph));
        ctx.drawImage(sprite,s.x-k,s.y-k,k*2,k*2);});
      ctx.globalAlpha=1;}}
  size();addEventListener('resize',size);requestAnimationFrame(frame);
})();

/* ---------- Boot ---------- */
/* nachSpeichern: nur Daten nachziehen -- Karussell-Index, offene Karte und Matrix-Schleife bleiben */
function boot(nachSpeichern){
 Promise.all([fetch('/api/manifest').then(r=>r.json()),
              fetch('/api/config').then(r=>r.json()),
              fetch('/api/abteilungen').then(r=>r.json()),
              fetch('/api/graph').then(r=>r.json()).catch(()=>({kanten:[]}))])
 .then(([m,cfg,ab,gr])=>{
   M=m;AGENTS=agents();
   GRAPH_KANTEN=gr.kanten||[];
   GRAPH_INFO={uebersprungen:gr.uebersprungen||0,unaufgeloest:gr.unaufgeloest||0};
   ABT=ab.abteilungen||[];DEPTS=ABT.map(a=>a.id);abtIndexBauen();
   renderWidgets(cfg);renderTermine();
   if($('#dashboards').classList.contains('on')){
     if(!nachSpeichern)renderDashboards();
     else{EXP_DATEN=null;DASH_PAGES=buildDashPages();$('#ccwrap .pg-full')?openDashFull(ccIdx):renderStage();}}
   if(!weltReady)initWelt(AGENTS);
   pollStatus();});
 if(nachSpeichern)return;
 applyTheme();
 if(MX&&MX.token)mxSync();   /* Chat laeuft im Hintergrund mit, damit Benachrichtigungen ankommen */
}
boot();
