<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PUOX OS</title>
<style>
:root{--bg:#131311;--panel:#1b1b18;--line:#2b2b26;--mint:#21F1A8;--mint2:#66B8FF;--cream:#E9E3D5;--dim:#8f8f83;
  --err:#FF6B6B;--amber:#d8b35a;
  /* Zwei Schriften: --font traegt den Fliesstext, --fonth die Ueberschriften (erbt --font, wenn leer
     gelassen). --fs/--fsh sind die zugehoerigen Groessen. */
  --font:system-ui;--fonth:system-ui;--fs:14px;--fsh:18px;
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
/* ---------- Scrollleisten: System aus, eigene minimal + dunkel, nur bei echtem Ueberlauf ----------
   Nur-Deko-Leisten waeren sonst ueberall sichtbar; `scrollbar-width:thin` blendet sie automatisch
   aus, sobald ein Element nicht ueberlaeuft -- genau das gewuenschte Verhalten. */
*{scrollbar-width:thin;scrollbar-color:#3a3a33 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#33332d;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#4a4a41;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
/* Der Seitenrahmen selbst scrollt nie -- nur die Bereiche darin */
html{scrollbar-width:none}
html::-webkit-scrollbar{width:0;height:0}
/* Weltall: heller Fleck unten-mitte, in alle Richtungen abdunkelnd. Liegt auf <html>, damit die
   Sterne-Canvas (#space, z-index -2) darueber malen kann -- ein Body-Hintergrund wuerde sie verdecken. */
html{background:
  radial-gradient(ellipse 130% 82% at 50% 106%,rgba(233,227,213,.10) 0%,rgba(233,227,213,.042) 32%,transparent 63%),
  radial-gradient(ellipse 150% 125% at 50% 48%,transparent 38%,rgba(0,0,0,.38) 100%),
  var(--bg)}
/* width/height explizit: ein <canvas> ist ein ersetztes Element -- mit inset:0 allein bliebe
   es auf seiner intrinsischen Groesse (0x0) stehen */
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
/* App-Gefuehl statt Webseite: nichts laesst sich markieren -- ausgenommen Eingabefelder
   und die wenigen Stellen, an denen man echten Inhalt liest/kopiert (Editor, Chat, Mail, Ausgaben) */
body{user-select:none;-webkit-user-select:none}
input,textarea,select,[contenteditable],#chatout,.mail-read,details pre,.selectable,.selectable *{
  user-select:text;-webkit-user-select:text}
body{background:transparent;color:var(--cream);font:var(--fs)/1.45 var(--font),system-ui,Segoe UI,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
/* Ueberschriften folgen der zweiten Schrift und der zweiten Groesse. h4/h5/h6 sind im Bestand
   Mini-Label (Grossbuchstaben, gesperrt) -- sie bleiben bewusst bei der Fliesstext-Groesse. */
h1,h2,h3,.brand,.cc-head h1{font-family:var(--fonth),var(--font),system-ui,sans-serif}
h1{font-size:calc(var(--fsh) * 1.5)}
h2{font-size:calc(var(--fsh) * 1.2)}
h3{font-size:var(--fsh)}
/* Eigener Hintergrund statt Weltall: liegt hinter allem, Sterne-Canvas wird dann ausgeblendet */
html.bild-bg{background:var(--bg)}
#bgbild{position:fixed;inset:0;z-index:-3;background:var(--bg) center/cover no-repeat;pointer-events:none;display:none}
html.bild-bg #bgbild{display:block}
html.bild-bg #space{display:none}
/* Keine weissen Systemfelder: gilt global, nicht nur fuer Felder in .box/.panel */
input:not([type=color]):not([type=checkbox]):not([type=radio]),textarea,select{
  background:var(--bg);border:1px solid var(--line);border-radius:3px;color:var(--cream);
  padding:8px 10px;font:13px system-ui;width:100%;min-width:0}
textarea{font-family:Consolas,monospace;font-size:12px}
input[type=file]{padding:6px 8px}
input::placeholder,textarea::placeholder{color:var(--dim)}
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);flex:none;position:relative}
header.top img{height:30px}
.brandwrap{grid-column:2;position:relative;display:flex;flex-direction:column;align-items:center}
.brandlink{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer;padding:4px 0}
.brand{font-size:19px;letter-spacing:.18em;font-weight:700}
/* Tab-Balken sitzt exakt auf der unteren Header-Linie: brandwrap-Unterkante + 8px Header-Padding + 1px Rahmen.
   In PUOX-Optik ohne eigene Flaeche -- die Knoepfe haben schon Outline und Fill. */
.brandwrap nav{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(-4px);display:flex;gap:6px;
  background:none;border:none;padding:7px;
  opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;z-index:30}
.brandwrap:hover nav,.brandwrap.open nav{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
/* Hover-Bruecke ueber die 9px Luecke -- am nav aufgehaengt, damit sie immer genau so breit
   ist wie das Menue selbst (frueher feste +/-60px, dahinter klappte es beim Runterfahren zu) */
.brandwrap nav::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px}
.brandwrap nav button{background:var(--bg);border:1px solid var(--line);color:var(--dim);padding:6px 13px;border-radius:3px;cursor:pointer;font:inherit;white-space:nowrap}
.brandwrap nav button.on{color:var(--bg);background:var(--mint);border-color:var(--mint);font-weight:600}
.brandwrap nav button:not(.on):hover{color:var(--cream);border-color:var(--dim)}
/* Einstellungen sitzt nicht im Menue, sondern als blankes Zahnrad oben rechts ueber der Header-Linie.
   Im Burger-Modus faellt es weg -- dort steht der Punkt im Menue selbst. */
/* Uhr und Zahnrad teilen sich die rechte Spalte -- als Flex-Zeile nebeneinander.
   Vorher lagen beide auf grid-column:3 mit justify-self:end und damit uebereinander. */
.kopf-rechts{grid-column:3;justify-self:end;display:flex;align-items:center;gap:14px}
#gear{background:none;border:none;color:var(--dim);font-size:18px;
  line-height:1;padding:5px 4px;cursor:pointer}
#gear:hover,#gear.on{color:var(--mint)}
/* Uhrzeit im Kopf: ueberall ausser auf der Map (dort steht sie gross in der linken Spalte).
   PUOX-Optik -> rechts; Burger -> auf der Gegenseite des Menues. */
#kopfuhr{display:none;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#kopfuhr b{font-weight:700;font-size:15px;letter-spacing:.03em}
#kopfuhr small{color:var(--dim);font-size:11px}
body.uhr-an #kopfuhr{display:flex}
/* rechts = direkt links neben dem Zahnrad (in .kopf-rechts), links = eigene Spalte am linken Rand */
#kopfuhr.links{grid-column:1;justify-self:start;margin-left:2px}
body.menue-burger #gear{display:none}
/* ---------- Burger-Menue (Alternative zur PUOX-Optik) ----------
   Liegt als Overlay ueber der Seite: Auf-/Zuklappen verschiebt nichts, es legt sich nur darueber. */
body.menue-burger .brandwrap nav{display:none}
#burger{position:fixed;z-index:42;background:var(--panel);border:1px solid var(--line);border-radius:5px;
  color:var(--cream);cursor:pointer;padding:8px 10px;line-height:0;display:none}
body.menue-burger #burger{display:block}
#burger span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;margin:3px 0;
  transition:transform .2s ease,opacity .2s ease}
#burger.auf span:nth-child(1){transform:translateY(5px) rotate(45deg)}
#burger.auf span:nth-child(2){opacity:0}
#burger.auf span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
#burger.pos-links{top:11px;left:14px}
#burger.pos-rechts{top:11px;right:14px}
#burger.pos-oben{top:11px;left:50%;transform:translateX(-50%)}
#burgermenu{position:fixed;z-index:41;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:9px;display:none;flex-direction:column;gap:6px;min-width:190px;
  box-shadow:0 14px 34px rgba(0,0,0,.45);opacity:0;transition:opacity .16s ease,transform .16s ease}
body.menue-burger #burgermenu{display:flex}
#burgermenu{pointer-events:none;transform:translateY(-6px)}
#burgermenu.auf{opacity:1;pointer-events:auto;transform:translateY(0)}
#burgermenu.pos-links{top:54px;left:14px}
#burgermenu.pos-rechts{top:54px;right:14px}
#burgermenu.pos-oben{top:54px;left:50%;margin-left:-95px}
#burgermenu.pos-oben.auf{transform:translateY(0)}
/* Fangflaeche zwischen Knopf und Menue -- sonst klappt es beim Rueberfahren zu (Auto-Modus) */
#burgermenu::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:16px}
#burgermenu button{background:none;border:1px solid var(--line);color:var(--dim);padding:8px 13px;border-radius:4px;
  cursor:pointer;font:inherit;text-align:left;white-space:nowrap}
#burgermenu button.on{color:var(--bg);background:var(--mint);border-color:var(--mint);font-weight:600}
#burgermenu button:not(.on):hover{color:var(--cream);border-color:var(--dim)}
#burgermenu hr{border:none;border-top:1px solid var(--line);margin:2px 0}
/* Freiraum in Hoehe des ausgeklappten Tab-Balkens -- so faellt nie Inhalt hinter die Tabs */
main{flex:1;min-height:0;position:relative;padding-top:52px}
.tab{display:none;height:100%;padding:12px 16px;overflow:auto}
.tab.on{display:block}
#dashboard.on{display:grid;position:relative;grid-template-columns:235px minmax(0,1fr) 235px;grid-template-rows:minmax(0,1fr) auto;gap:8px 12px;overflow:hidden}
#dashboard>.col:nth-child(1){grid-column:1}
#dashboard>.col:nth-child(3){grid-column:3}
.col{display:flex;flex-direction:column;gap:16px;min-height:0;padding:4px 2px;position:relative;z-index:1}
.w h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.big{font-size:25px;font-weight:700;color:var(--mint)}
#clock{font-size:31px;font-weight:700;letter-spacing:.04em}
#datum{color:var(--dim);font-size:12px}
#wTermine{flex:1;min-height:0;display:flex;flex-direction:column}
#termine{flex:1;overflow:auto;min-height:0}
#termine div{padding:3px 0;font-size:12px}
#termine div.lokal{cursor:pointer}
#termine div.lokal:hover{color:var(--mint)}
#termine b{color:var(--mint);font-weight:600;margin-right:6px}
/* Die Karte fuellt die ganze Flaeche (frueher ein kleines Quadrat in der Mitte) -- nur so laesst
   sie sich endlos ziehen, ohne dass Knoten am Rand verschwinden.
   z-index MUSS 0 sein, nicht -1: bei -1 liegt die Karte hinter dem #dashboard-Kasten, und der
   faengt dann jeden Klick und jedes Mausrad ab -- Ziehen und Zoomen waren dadurch tot.
   Die Widget-Spalten (.col, #road) stehen auf z-index:1 und bleiben darueber bedienbar. */
#orbwrap{position:absolute;inset:0;z-index:0;min-height:0;pointer-events:none}
#orb{position:absolute;inset:0;pointer-events:auto}
/* Keine Maske mehr: die weiche Ellipse erzeugte beim Ziehen eine sichtbare Kante, an der Knoten
   verschwanden. Der Freiraum hinter den festen Texten wird stattdessen direkt in der Canvas
   ausgestanzt (freiraumStanzen) -- dadurch laesst sich die Karte randlos verschieben. */
#orb canvas{width:100%;height:100%;display:block;cursor:grab}
#road{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding-bottom:2px;position:relative;z-index:1}
#roadbar{flex:1;height:13px;background:var(--panel);border:1px solid var(--line);border-radius:5px;overflow:hidden}
#roadfill{height:100%;background:linear-gradient(90deg,#0d8f63,var(--mint));width:0%;transition:width .8s}
#road small{color:var(--dim);white-space:nowrap}
.ring{width:22px;height:22px;border:4px solid var(--mint);border-radius:50%;flex:none}
.ring.plan{border-style:dashed;border-width:3px;opacity:.7}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--dim);white-space:nowrap}
.badge.mint{color:#0c0c0b;background:var(--mint);border-color:var(--mint)}
.badge.err{color:#0c0c0b;background:var(--err);border-color:var(--err)}
.badge.plan{color:var(--amber);border-color:var(--amber)}
.badge.lock{color:var(--err);border-color:var(--err)}
button.act{background:none;border:1px solid var(--mint);color:var(--mint);border-radius:4px;padding:7px 14px;cursor:pointer;font:inherit}
button.act:hover{background:var(--mint);color:var(--bg)}
button.act[disabled]{border-color:var(--line);color:var(--dim);cursor:not-allowed;background:none}
.mini{background:none;border:1px solid var(--line);color:var(--mint);border-radius:3px;padding:2px 9px;cursor:pointer;font:11px system-ui;text-decoration:none;display:inline-block}
.mini:hover{border-color:var(--mint)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr[data-path],tr[data-pot]{cursor:pointer}
tr[data-path]:hover td,tr[data-pot]:hover td{color:var(--mint)}
.pills{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pills button{background:none;border:1px solid var(--line);color:var(--dim);padding:5px 12px;border-radius:14px;cursor:pointer;font:12px system-ui}
.pills button.on{color:var(--bg);background:var(--mint);border-color:var(--mint);font-weight:600}
.bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 14px;margin-bottom:10px}
.bar small{display:block;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.mon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px}
.mon svg{width:104px;height:104px}
.cap{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#monhero{display:flex;flex-direction:column;gap:4px;padding:18px 22px;max-width:860px;margin:0 auto}
#monhero .top{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.urow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.urow b{width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.udot{width:11px;height:11px;border-radius:50%;flex:none}
.udot.ok{background:var(--mint)}.udot.down{background:var(--err)}
.uticks{display:flex;gap:2px;flex:1;min-width:0;overflow:hidden}
.uticks i{width:6px;height:16px;border-radius:2px;flex:none}
.uticks i.ok{background:var(--mint)}.uticks i.down{background:var(--err)}
.ucode{color:var(--dim);font-size:11px;width:70px;flex:none;text-align:right}
.upct{width:60px;flex:none;text-align:right;font-weight:700;color:var(--mint)}
.urow.down .upct{color:var(--err)}
.ok{color:var(--mint)}.warn{color:var(--err)}.muted{color:var(--dim)}
details pre{font:11px/1.5 Consolas,monospace;color:var(--dim);white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:6px}
details summary{cursor:pointer;color:var(--dim);font-size:11px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:var(--panel);border:1px solid var(--mint);border-radius:8px;padding:18px 20px;width:min(620px,94vw);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box .head{display:flex;align-items:center;gap:11px}
.box h3{letter-spacing:.08em}
.box .akr{color:var(--dim);font-size:11px;font-style:italic}
#chatout{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.5 Consolas,monospace;white-space:pre-wrap;max-height:38vh;overflow:auto}
/* ---------- Map: Abteilungs-Overlay + Agenten-Slide-in-Panel ---------- */
/* Morph: das Vollbild schiebt sich aus der angeklickten Abteilung heraus auf */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:15;display:flex;opacity:0;transform:scale(.93);
  transition:opacity .26s ease,transform .34s cubic-bezier(.18,.72,.28,1)}
.overlay.show{opacity:1;transform:scale(1)}
/* Weiche Kante statt harter Schnitt. Weit gefasst, weil die Abteilung unten in der Mitte sitzt --
   bei 55 % waere genau das Piktogramm der Abteilung weggeblendet. */
.overlay canvas{flex:1;width:100%;height:100%;cursor:grab;display:block;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 80%,transparent 100%);
  mask-image:radial-gradient(ellipse at center,#000 80%,transparent 100%)}
.ov-back{position:absolute;top:14px;left:18px;z-index:2;border:none;padding:2px 0;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ov-back:hover{color:var(--mint)}
.ov-count{position:absolute;top:18px;right:18px;z-index:2;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ov-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:8px;cursor:pointer;background:none;border:none;color:var(--dim);font:20px system-ui;padding:6px}
.ov-nav:hover{color:var(--mint)}
.ov-nav.prev{left:6px}.ov-nav.next{right:6px}
.ov-nav .lbl{writing-mode:vertical-rl;letter-spacing:.18em;font-size:10px;text-transform:uppercase;font-family:system-ui}
.ov-title{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none}
.ov-title b{font-size:16px;letter-spacing:.14em}
.ov-title small{display:block;color:var(--dim);margin-top:3px;font-size:11px}
/* Slide-in-Karte von links: kein Schlagschatten, dafuer durchscheinend mit Weichzeichner --
   der Hintergrund bleibt erkennbar, der Text darauf trotzdem klar lesbar.
   color-mix haelt die Deckkraft an die eingestellte Panel-Farbe gekoppelt. */
.panel{position:fixed;top:0;left:0;bottom:0;width:min(380px,88vw);
  background:color-mix(in srgb,var(--panel) 82%,transparent);
  -webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border-right:1px solid var(--mint);
  transform:translateX(-102%);transition:transform .22s ease;z-index:40;
  display:flex;flex-direction:column;padding:20px 20px 16px;gap:10px;overflow:auto}
.panel.show{transform:translateX(0)}
.panel .pclose{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:50%;width:26px;height:26px;cursor:pointer;line-height:1}
.panel .pclose:hover{color:var(--cream);border-color:var(--dim)}
.panel.wide{width:min(560px,94vw)}
.panel .ptag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.panel h2{font-size:21px;letter-spacing:.02em;margin:0}
.panel .psub{color:var(--dim);font-size:11px;font-style:italic}
.panel .frm{margin-top:4px}
.panel textarea#tEdit{flex:1 1 auto;min-height:min(56vh,520px);resize:vertical}
.panel .pfoot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .pfoot .del{border-color:var(--err);color:var(--err)}
.panel .pfoot .del:hover{background:var(--err);color:var(--bg)}
.tag-ev{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
  border-radius:5px;margin-bottom:6px;background:var(--bg)}
.tag-ev .zeit{color:var(--mint);font-weight:600;font-size:12px;min-width:42px;flex:none}
.tag-ev .was{flex:1;font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.tag-ev .ext{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex:none}
.tag-ev.lokal{cursor:pointer}
.tag-ev.lokal:hover{border-color:var(--mint)}
.tag-ev.lokal:hover .was{color:var(--mint)}
.panel .psec{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.panel .psec h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.panel .pchat{flex:1;display:flex;flex-direction:column;min-height:0}
/* Datei-Ansicht wie in Obsidian: gerenderte Vorschau, klickbare [[Wikilinks]], Backlinks */
.mini.on{color:var(--bg);background:var(--mint);border-color:var(--mint);font-weight:600}
.mdview{flex:1 1 auto;min-height:min(46vh,440px);overflow:auto;background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:14px 16px;font-size:13px;line-height:1.62}
.mdview h1,.mdview h2,.mdview h3,.mdview h4,.mdview h5,.mdview h6{margin:14px 0 6px;line-height:1.3}
.mdview h1{font-size:19px}.mdview h2{font-size:17px}.mdview h3{font-size:15px}
.mdview h4,.mdview h5,.mdview h6{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.mdview p{margin:6px 0}
.mdview ul,.mdview ol{margin:6px 0 6px 20px}
.mdview li{margin:2px 0}
.mdview hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.mdview code{background:var(--panel);border-radius:2px;padding:1px 4px;font:11.5px Consolas,monospace}
.mdview pre{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 11px;
  font:11.5px/1.5 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.mdview blockquote{border-left:2px solid var(--line);padding-left:10px;color:var(--dim);margin:6px 0}
.mdview .mdrow{font:11.5px Consolas,monospace;color:var(--dim);white-space:pre-wrap}
.mdview table.mdtab{display:block;overflow-x:auto;border-collapse:collapse;margin:8px 0;font-size:.92em}
.mdview .mdtab th,.mdview .mdtab td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;
  overflow-wrap:normal;word-break:normal}   /* lieber waagerecht scrollen als mitten im Wort trennen */
.mdview .mdtab th{background:var(--panel);text-transform:none;letter-spacing:normal;font-weight:600;color:var(--cream)}
.mdview .mdfm{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:8px 10px;
  font:11px/1.5 Consolas,monospace;color:var(--dim);white-space:pre-wrap;margin-bottom:12px}
.mdview a,.mdlinks a{color:var(--mint);text-decoration:none;cursor:pointer}
.mdview a:hover,.mdlinks a:hover{text-decoration:underline}
.mdview a.wl.miss{color:var(--dim);cursor:default;text-decoration:line-through}
.mdlinks a{display:block;padding:3px 0;font-size:12px;overflow-wrap:anywhere}
/* ---------- Dashboards-Tab: 3D-Ring-Karussell auf einem Oval, Klick oeffnet volles Dashboard ----------
   Die Karten sitzen auf einem echten Kreis (Radius --ccR) in Kamerahoehe; das Oval darunter ist derselbe
   Kreis flach gelegt (rotateX 90deg) und erscheint nur durch die Perspektive als Ellipse -- dadurch fahren
   die Karten sichtbar auf genau dieser Bahn. */
#ccwrap{height:100%;display:flex;flex-direction:column;padding:0;overflow:hidden;
  --ccW:640px;--ccH:441px;--ccR:736px}
.cc-scene{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.cc-head{text-align:center;padding:22px 20px 0;flex:none;pointer-events:none}
.cc-kicker{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.cc-head h1{font-size:clamp(26px,3.4vw,44px);font-weight:400;letter-spacing:.01em;margin:8px 0 6px}
.cc-head p{font-size:13px;color:var(--dim)}
.cc-head p b{color:var(--cream);font-weight:600}
.cc-stage{flex:1;min-height:0;position:relative;perspective:calc(var(--ccW) * 2.18);perspective-origin:50% 50%;
  touch-action:pan-y;cursor:grab}
.cc-stage.dragging{cursor:grabbing}
.cc-world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.cc-card{position:absolute;left:0;top:0;width:var(--ccW);height:var(--ccH);margin:calc(var(--ccH) / -2) 0 0 calc(var(--ccW) / -2);
  border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:0 26px 60px rgba(0,0,0,.55);
  display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
  transform-origin:50% 50%}
/* will-change nur waehrend der Fahrt UND nur fuer Karten, die man gerade sieht: dauerhaft und
   flaechendeckend gesetzt bekommt jede der sieben Karten eine eigene GPU-Ebene, auch die zwei
   hinter der Buehne. `bewegt` setzt das Karussell, `sichtbar` je Karte paintAt(). */
.cc-stage.bewegt .cc-card.sichtbar{will-change:transform,opacity,filter}
.cc-card.active{border-color:rgba(33,241,168,.55);box-shadow:0 0 14px 1px rgba(33,241,168,.05),0 26px 60px rgba(0,0,0,.55)}
.cc-preview{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.cc-preview .inner{width:820px;transform-origin:top left;padding:18px 22px;pointer-events:none}
/* Auf der Karte steht der Name schon im Fuss -- die Ueberschrift im Inhalt waere doppelt */
.cc-preview .inner>h2{display:none}
.cc-card-foot{padding:13px 20px;border-top:1px solid var(--line);flex:none}
.cc-card-foot b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.cc-card-foot small{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  color:var(--dim);font-size:11.5px;line-height:1.4;margin-top:4px}
/* Nur noch der flache Lichtschein auf der Karten-Bahn -- die gestrichelten Kreisstriche sind raus.
   Das Element war 2,12 x --ccR gross, bei grossem Fenster 2150 x 2150 px -- eine eigene Ebene, groesser
   als alle sieben Karten zusammen. Zwei Schritte, beide optisch folgenlos:
   1. Beschnitt auf 64 %: der Verlauf endet bei 64 % Radius, die aeusseren 36 % waren reine leere
      Flaeche. Die Stops wandern mit (46 % / 64 % = 71,875 %). Pixelvergleich: 0 Abweichung.
   2. Nochmal auf ein Viertel, per scale(4) in measure() wieder aufgezogen. Der Verlauf ist so weich,
      dass die Interpolation hoechstens eine von 255 Alphastufen kostet.
   `will-change:transform` haelt Chrome davon ab, die Ebene doch in Zielaufloesung zu rastern --
   ohne den Hinweis kann die Raster-Heuristik den zweiten Schritt zunichtemachen.
   2,12 * 0,64 / 4 = 0,3392 -- zusammen 2,56 % der urspruenglichen Flaeche. */
.cc-oval{position:absolute;left:0;top:0;width:calc(var(--ccR) * .3392);height:calc(var(--ccR) * .3392);
  margin:calc(var(--ccR) * -.1696) 0 0 calc(var(--ccR) * -.1696);border-radius:50%;border:none;pointer-events:none;
  will-change:transform;
  background:radial-gradient(ellipse at 50% 50%,rgba(33,241,168,.05),rgba(33,241,168,.012) 71.875%,transparent 100%)}
/* Ein Punkt je Karte unter dem Karussell, die zentrierte Karte in Akzentfarbe */
.cc-foot{flex:none;padding:0 0 14px;text-align:center;position:relative;z-index:2;
  display:flex;justify-content:center;gap:9px}
.cc-foot i{width:7px;height:7px;border-radius:50%;background:var(--dim);opacity:.4;transition:background .2s,opacity .2s}
.cc-foot i.on{background:var(--mint);opacity:1}
/* Pfeile senkrecht mittig am Seitenrand */
.cc-arrow{position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);
  font:300 40px/1 system-ui;cursor:pointer;padding:14px 16px;z-index:3}
.cc-arrow:hover{color:var(--mint)}
.cc-arrow.prev{left:8px}.cc-arrow.next{right:8px}
.pg-arrow{background:none;border:none;color:var(--dim);font-size:28px;cursor:pointer;padding:0 12px;align-self:center;line-height:1;flex:none}
.pg-arrow:hover{color:var(--mint)}
/* Karten laufen ueber die volle Breite -- feste max-width liess zu viel Rand stehen */
.pg-full{height:100%;overflow:auto;padding:16px 46px;box-sizing:border-box;position:relative}
/* Wechsler im geoeffneten Dashboard: senkrecht mittig am Rand, Pfeil aussen, Beschriftung
   auf gleicher Hoehe daneben (nicht mehr darunter), Schrift zur Mitte gedreht */
.pg-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:row;
  align-items:center;gap:6px;cursor:pointer;background:none;border:none;color:var(--dim);
  font:22px system-ui;padding:10px 4px}
.pg-nav.next{flex-direction:row-reverse}
.pg-nav:hover{color:var(--mint)}
.pg-nav.prev{left:2px}.pg-nav.next{right:2px}
.pg-nav .lbl{writing-mode:vertical-rl;letter-spacing:.18em;font-size:10px;text-transform:uppercase}
.pg-nav.prev .lbl{transform:rotate(180deg)}
.pg-full-inner{max-width:none;margin:0}
.pg-full-inner h2{margin-bottom:2px}
.pg-fullhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;max-width:none;margin:0 0 14px}
.pg-fullhead h2{grid-column:2;text-align:center;white-space:nowrap;margin:0}
.pg-fullhead .pg-back{grid-column:1;justify-self:start;margin:0}
.pg-fullhead .pg-brand{grid-column:3;justify-self:end;color:var(--dim);font-size:11px;letter-spacing:.18em}
/* Zurueck aus einem geoeffneten Dashboard: ganz oben links ueber der Header-Linie, ohne Rahmen.
   Davor der gedrehte Pfeil wie im Command Center (::before, damit jeder Aufrufer ihn bekommt). */
.hdr-back{position:fixed;top:11px;left:16px;z-index:31;background:none;border:none;padding:4px 6px;
  color:var(--dim);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.hdr-back::before{content:'⟲';font-size:15px;line-height:1;display:inline-block;transition:transform .2s ease}
.hdr-back:hover{color:var(--mint)}
.hdr-back:hover::before{transform:rotate(-40deg)}
/* Im Burger-Modus links wuerde der Zurueck-Knopf unter dem Menuekopf liegen */
body.menue-burger.burger-links .hdr-back{left:64px}
.cc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.cc-stat{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.cc-stat .v{font-size:18px;font-weight:700;color:var(--mint)}
.cc-stat .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
/* ---------- Explorer: Ordnerbaum links, Dateiliste rechts ----------
   Hoehe ueber vh statt 100% -- die Karte im Karussell und die Vollseite haben verschiedene
   Hoehenketten, und eine luckenlose 100%-Kette gibt es in beiden nicht. */
.exp{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start}
.exp-baum,.exp-liste{border:1px solid var(--line);border-radius:5px;background:var(--bg);
  max-height:58vh;overflow:auto}
.exp-baum{padding:6px 0;font-size:12px}
.exp-liste table{margin:0}
.exp-zweig{display:flex;align-items:center;gap:6px;padding-top:3px;padding-bottom:3px;padding-right:8px;
  cursor:pointer;white-space:nowrap;color:var(--dim)}
.exp-zweig:hover{color:var(--cream);background:var(--panel)}
.exp-zweig.on{color:var(--mint)}
.exp-zweig small{margin-left:auto;font-size:10px;opacity:.6}
.exp-pfeil{width:11px;flex:none;text-align:center;font-size:9px;opacity:.7}
.exp-krume{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.exp-krume a{color:var(--dim);text-decoration:none}
.exp-krume a:hover{color:var(--mint)}
.exp-krume i{opacity:.4;font-style:normal}
.exp-liste tr.exp-md,.exp-liste tr.exp-ord{cursor:pointer}
.exp-liste tr.exp-roh{color:var(--dim);cursor:default}
/* ---------- Chart-Tab: Automatisierungs-Board ---------- */
#chartwrap{padding:0}
.ch-col{display:flex;flex-direction:column;gap:8px}
.ch-board{display:grid;gap:10px;margin-top:12px}
.ch-head{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;text-align:center}
.ch-head b{display:block;font-size:12px}
.ch-head small{color:var(--dim);font-size:10px}
.ch-row{display:grid;gap:10px;margin-bottom:10px}
.ch-rowlabel{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px 2px}
.ch-rowlabel b{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ch-rowlabel small{color:var(--dim);font-size:10px}
.ch-cell{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:6px;min-height:40px}
.ch-job{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;font-size:11.5px}
.ch-job:hover{border-color:var(--mint);color:var(--mint)}
.ch-legend{display:flex;gap:16px;font-size:11px;color:var(--dim);margin:8px 0}
.ch-team{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.ch-team h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.ch-team h4 small{text-transform:none;letter-spacing:0;font-size:11px}
.ch-legend span{display:inline-flex;align-items:center;gap:5px}
.ch-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.row{display:flex;gap:8px;align-items:center}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm .full{grid-column:1/-1}
label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
/* ---------- Kalender: links Monatsuebersicht + Werkzeuge, rechts gross die Woche ---------- */
#kalender.tab{padding:0;overflow:hidden}
.kal2{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0}
.kal-side{border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:14px 12px;
  display:flex;flex-direction:column;gap:14px}
.km-head{display:flex;align-items:center;gap:6px}
.km-head b{flex:1;text-align:center;font-size:12.5px;letter-spacing:.05em}
.km-head .mini{padding:2px 8px}
/* Monatsraster: KW-Spalte + 7 Tage, immer 6 Zeilen -- so springt nichts, wenn ein Monat kuerzer ist */
.km-grid{display:grid;grid-template-columns:22px repeat(7,1fr);gap:1px;font-size:10.5px;text-align:center}
.km-grid .wd{color:var(--dim);font-size:9.5px;letter-spacing:.06em;padding:3px 0}
.km-grid .kwnr{color:var(--dim);font-size:9px;display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--line);opacity:.75}
.km-grid .tag{padding:4px 0;border-radius:3px;cursor:pointer;position:relative}
.km-grid .tag:hover{background:var(--line)}
.km-grid .tag.fremd{color:var(--dim);opacity:.42}
.km-grid .tag.hat::after{content:'';position:absolute;left:50%;bottom:1px;width:3px;height:3px;
  border-radius:50%;background:var(--mint2);transform:translateX(-50%)}
.km-grid .tag.woche{background:rgba(233,227,213,.05)}
.km-grid .tag.heute{background:var(--mint);color:var(--bg);font-weight:700}
.km-grid .tag.heute.hat::after{background:var(--bg)}
.kal-block{display:flex;flex-direction:column;gap:7px}
.kal-block h4{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kal-akt{flex-direction:row;align-items:center}
.kal-akt .act{flex:1;font-size:12px;padding:7px 8px}
.kal-akt .mini{flex:none;font-size:14px;padding:5px 9px}
.kal-akt .mini.dreht{animation:spin .9s linear infinite}
.kal-treffer{max-height:200px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:3px}
.kal-treffer .tr{padding:5px 7px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:11.5px}
.kal-treffer .tr:hover{border-color:var(--mint);color:var(--mint)}
.kal-treffer .tr small{display:block;color:var(--dim);font-size:10px}
.kal-quelle{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 0;cursor:pointer}
.kal-quelle i{width:9px;height:9px;border-radius:3px;flex:none}
.kal-quelle.aus{opacity:.42}
.kal-quelle span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kal-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.kal-mainhead{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;flex:none}
.kal-mainhead h3{min-width:210px;text-align:center;letter-spacing:.05em}
.kal-mainhead .mini{padding:3px 10px}
/* Kopfzeile der Woche bleibt stehen, das Raster darunter scrollt */
.kw-kopf{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);flex:none;padding-right:9px}
.kw-kopf>div{text-align:center;padding:6px 3px;font-size:11px;border-right:1px solid var(--line);min-width:0}
.kw-kopf>div:last-child{border-right:none}
.kw-kopf .ecke{font-size:9.5px;color:var(--dim);letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
.kw-kopf .tk b{display:block;font-size:14px;font-weight:600}
.kw-kopf .tk small{color:var(--dim);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.kw-kopf .tk{cursor:pointer}
.kw-kopf .tk.heute b,.kw-kopf .tk.heute small{color:var(--mint)}
/* Gewaehlter Tag: nur die Spalte hervorheben, kein Raster ueber die ganze Woche */
.kw-kopf .tk.gewaehlt{background:rgba(233,227,213,.06);box-shadow:inset 0 -2px 0 var(--cream)}
.kw-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
/* --stdh wird beim Zeichnen gesetzt: sichtbare Hoehe / 8, damit 6–14 Uhr genau ins Bild passen */
.kw-raster{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));position:relative}
.kw-raster .zeit{grid-column:1;color:var(--dim);font-size:10.5px;text-align:right;padding:2px 7px 0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:var(--stdh);
  font-variant-numeric:tabular-nums;overflow:hidden}
.kw-raster .zelle{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:var(--stdh);
  position:relative;cursor:pointer;min-width:0}
.kw-raster .zelle:hover{background:rgba(233,227,213,.03)}
.kw-raster .zelle.gewaehlt{background:rgba(233,227,213,.05)}
/* Heute bekommt die Akzent-Hervorhebung -- nicht der angeklickte Tag */
.kw-raster .zelle.heute{background:rgba(33,241,168,.045)}
.kw-raster .zelle.heute.gewaehlt{background:rgba(33,241,168,.08)}
.kw-ganz{display:grid;grid-template-columns:54px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.kw-ganz .zeit{color:var(--dim);font-size:10px;text-align:right;padding:5px 7px;border-right:1px solid var(--line)}
.kw-ganz .zelle{padding:3px;border-right:1px solid var(--line);min-height:26px;cursor:pointer;min-width:0}
/* Roter Balken auf der aktuellen Uhrzeit; der Punkt links markiert den heutigen Tag */
.kw-jetzt{position:absolute;left:54px;right:0;height:0;border-top:2px solid #FF4040;z-index:4;pointer-events:none}
.kw-jetzt::before{content:'';position:absolute;left:var(--tagx,0);top:-5px;width:8px;height:8px;
  border-radius:50%;background:#FF4040}
.kw-jetzt small{position:absolute;left:-52px;top:-8px;background:#FF4040;color:#fff;font-size:9.5px;
  padding:1px 4px;border-radius:3px;font-variant-numeric:tabular-nums}
.kev{background:rgba(33,241,168,.12);color:var(--mint);border-radius:3px;padding:1px 5px;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;border-left:2px solid var(--mint)}
.kev.lokal{cursor:pointer}
.kev.lokal:hover{filter:brightness(1.35)}
/* Termine liegen absolut in der Stundenzelle, damit sie die Zeilenhoehe nicht sprengen */
.kw-raster .kev{position:absolute;left:2px;right:2px;margin:0;z-index:2}
@media(max-width:900px){.kal2{grid-template-columns:1fr}.kal-side{display:none}}
.uplug{padding:8px 0 12px 23px;border-top:1px dashed var(--line)}
.pie-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;justify-items:center;padding:24px 0}
.pie-col{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:460px;width:100%}
.pie-col h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pie-col svg{width:min(36vw,420px);height:auto}
.dseg{transition:opacity .15s,transform .15s;cursor:pointer;transform-origin:100px 100px}
.dseg:hover{opacity:.85;transform:scale(1.03)}
.dlegend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;width:100%;max-width:320px}
.dlegend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;flex:none}
.dlegend div{display:flex;align-items:center;cursor:pointer;border-radius:3px;padding:2px 4px}
.dlegend div:hover{background:var(--panel);color:var(--mint)}
@media(max-width:820px){.pie-grid{grid-template-columns:1fr;gap:30px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:11px;color:var(--mint)}
.chip.klick{cursor:pointer}
.chip.klick:hover{border-color:var(--mint);background:rgba(33,241,168,.08)}
/* Zustaendigkeit im Abteilungs-Panel: aufklappbar, darunter die Stationen als nummerierte Liste */
.zus{border:1px solid var(--line);border-radius:5px;margin-bottom:5px;background:var(--bg)}
.zus summary{cursor:pointer;padding:7px 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;
  list-style:none;margin:0;color:var(--cream)}
.zus summary::-webkit-details-marker{display:none}
.zus summary::after{content:'▸';margin-left:auto;color:var(--dim);transition:transform .15s ease}
.zus[open] summary::after{transform:rotate(90deg)}
.zus summary small{color:var(--dim);font-size:10px}
.zus .pkt{width:8px;height:8px;border-radius:50%;flex:none}
.zus ol{margin:0;padding:2px 12px 10px 32px;font-size:11.5px;color:var(--dim);line-height:1.65}
.zus ol li{margin:1px 0}
.zus ol li::marker{color:var(--mint2)}
.card,.mon,.box,.grid>*{min-width:0}
.card{overflow:hidden}
.mon details{width:100%}
details pre,#chatout,td,th{overflow-wrap:anywhere}

/* Der Zwischen-Container braucht die Hoehe ausdruecklich -- sonst waechst er mit dem Inhalt
   und das height:100% von .ein-wrap bezieht sich auf eine auto-hohe Box, laeuft also ins Leere. */
#einwrap{height:100%;min-height:0}
/* grid-template-rows MUSS gesetzt sein: ohne die Zeilenangabe waechst die implizite Zeile mit dem
   Inhalt, der Kasten wird meterhoch und .ein-body scrollt nie -- die Seite wirkt dann abgehackt. */
.ein-wrap{height:100%;display:grid;grid-template-columns:190px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);min-height:0}
.ein-nav{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}

  cursor:pointer;font:inherit}
.ein-nav button:hover{color:var(--cream);background:var(--panel)}
.ein-nav button.on{color:var(--mint);background:var(--panel);font-weight:600}
.ein-body{overflow:auto;padding:18px 26px 60vh;scroll-behavior:smooth}

/* ---------- Mail-Tab: PIN-Gate/Setup + 3-Spalten-Client (Betterbird-artig, PUOX-Optik) ---------- */
.mail-gate{height:100%;display:flex;align-items:center;justify-content:center}
.mail-gate .box{width:min(380px,92vw);text-align:center}
.mail-gate .box h3{margin-bottom:2px}
.mail-gate .muted{font-size:11px;margin-bottom:6px}
.mail-gate input{text-align:center;font-size:16px}
/* PIN-Feld: zeigt nie etwas an. Der kurze Rahmen-Blitz ist die einzige Rueckmeldung,
   dass ein Anschlag ankam -- er verraet die Laenge nicht. */
.pinfeld{caret-color:transparent}
.pinfeld.tippt{animation:pinpuls .28s ease}
@keyframes pinpuls{0%{border-color:var(--mint);box-shadow:0 0 0 2px rgba(33,241,168,.16)}
  100%{border-color:var(--line);box-shadow:none}}
.mail-setup{height:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px}
.mail-setup .box{width:min(480px,94vw)}
.mail-setup .hint{font-size:11px;color:var(--dim);line-height:1.5}
.mail3{height:100%;display:grid;grid-template-columns:216px 320px minmax(0,1fr);gap:0;min-height:0}
.mail-folders{border-right:1px solid var(--line);overflow:hidden;padding:0;display:flex;flex-direction:column;
  min-height:0;position:relative}
/* Drei gleichrangige Knoepfe: Neu · Ordner · Abgleich. Jeder hat exakt seine eigene Flaeche --
   vorher zog der Neu-Knopf die ganze Zeile und die Hitbox des Abgleichs lag daneben. */
.mail-top{display:flex;gap:6px;padding:9px 8px;border-bottom:1px solid var(--line);flex:none;align-items:stretch}
.mail-top .mt-btn{flex:1 1 0;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:7px 6px;font:12px system-ui;line-height:1;border-radius:4px;white-space:nowrap;overflow:hidden}
.mail-top .mt-btn span{overflow:hidden;text-overflow:ellipsis}
.mail-top .mt-btn.nurikon{flex:0 0 36px;font-size:15px}
.mail-top .mt-btn:hover:not(:disabled){border-color:var(--mint);color:var(--mint)}
.mail-top .mt-btn:disabled{opacity:.5;cursor:default}
#mailCompose{border-color:var(--mint);color:var(--mint)}
#mailCompose:hover{background:var(--mint);color:var(--bg)}
.mail-top .mt-btn.dreht{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mail-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 6px}
/* Ziehgriff zwischen Ordnerspalte und Liste */
.mail-griff{position:absolute;top:0;right:-3px;bottom:0;width:7px;cursor:col-resize;z-index:3}
.mail-griff:hover,.mail-griff.zieht{background:linear-gradient(90deg,transparent 2px,var(--mint) 2px,var(--mint) 5px,transparent 5px)}
.mail-acct{margin-bottom:6px}
.mail-acct-head{display:flex;align-items:center;gap:6px;padding:6px 8px 5px;cursor:pointer;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-radius:4px}
.mail-acct-head:hover{background:var(--panel);color:var(--cream)}
.mail-acct-head .caret{flex:none;font-size:9px;transition:transform .15s ease}
.mail-acct-head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-acct-head .neu{flex:none;color:var(--mint);font-weight:700;letter-spacing:0}
.mail-acct.zu .caret{transform:rotate(-90deg)}
.mail-acct.zu .mail-acct-body{display:none}
.mail-acct-err{padding:4px 8px;font-size:10.5px;color:var(--err)}
/* Unterordner: je Ebene 13 px eingerueckt, mit zarter Fuehrungslinie.
   Die Linie haengt an .tief -- ein Attributselektor auf den Inline-Style waere bruechig. */
.mail-fold{display:flex;align-items:center;gap:1px;padding-left:calc(var(--tiefe,0) * 13px);position:relative}
.mail-fold.tief::before{content:'';position:absolute;left:calc(var(--tiefe,0) * 13px - 7px);top:4px;bottom:4px;
  width:1px;background:var(--line)}
.mail-fold .fx{flex:none;opacity:0;background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:11px;padding:3px 4px;width:auto;border-radius:3px}
.mail-fold:hover .fx{opacity:1}
.mail-fold .fx:hover{color:var(--mint);background:var(--panel)}
.mail-fold.nichtwaehlbar button.f{opacity:.5;cursor:default;font-style:italic}
.mail-folders button{background:none;border:none;color:var(--dim);text-align:left;padding:7px 10px;border-radius:4px;
  cursor:pointer;font:12.5px system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;min-width:0}
.mail-folders button:hover{color:var(--cream);background:var(--panel)}
.mail-folders button.on{color:var(--bg);background:var(--mint);font-weight:600}
.mail-foot{margin-top:auto;padding:8px 6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;flex:none}
/* Einstellungen im Mail-Tab: Abschnitte klar getrennt */

.mfset h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint2);margin-bottom:8px}
.mfset .hint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.mail-set{overflow:auto;padding:18px 24px}
.mail-set h3{font-size:15px;margin-bottom:12px}
.mail-list{border-right:1px solid var(--line);overflow:auto}
.mail-row{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mail-row:hover{background:var(--panel)}
.mail-row.on{background:var(--panel);border-left:2px solid var(--mint)}
.mail-row .mf{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim)}
.mail-row .ms{font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail-row.unseen .ms{font-weight:700;color:var(--cream)}
.mail-row.unseen .mf b{color:var(--cream)}
/* Waagerecht wird nirgends gescrollt -- ausser dort, wo echter Inhalt breiter ist als die Spalte
   (HTML-Mails im iframe, Tabellen, Code). Ueberall sonst bricht der Text um. */
.mail-list{overflow-y:auto;overflow-x:hidden}
.mail-row .ms,.mail-row .mf{min-width:0}
.mail-read{overflow-y:auto;overflow-x:hidden;padding:18px 24px;display:flex;flex-direction:column;min-height:0}
.mail-read .mtext,.mail-read .mhead h3,.mail-read .mhead .row{overflow-wrap:anywhere;word-break:break-word}
.mail-read table,.mail-read pre{display:block;max-width:100%;overflow-x:auto}
/* Der Inhalt zieht bis ans Seitenende -- vorher stand das Vorschaufeld auf 200 px fest */
.mail-read iframe,.mail-read .mtext{flex:1 1 auto;min-height:min(64vh,860px)}
.mail-star{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.mail-star.an{color:var(--amber)}
.mail-row .mstar{float:right;color:var(--amber);font-size:11px}
.mail-read .mhead{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.mail-read .mhead h3{font-size:17px;margin-bottom:8px}
.mail-read .mhead .row{font-size:12px;color:var(--dim);gap:6px}
.mail-read .mhead .row b{color:var(--cream);font-weight:600}
.mail-read iframe{width:100%;border:none;min-height:200px;background:var(--cream);border-radius:5px}
.mail-read .mtext{white-space:pre-wrap;font-size:13px;line-height:1.6}
.mail-att{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mail-att a{border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-size:11.5px;color:var(--mint);
  text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mail-att a:hover{border-color:var(--mint)}
.mail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim);font-size:12.5px}
@media(max-width:900px){.mail3{grid-template-columns:120px 1fr}.mail-read{display:none}}

.mx{height:100%;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:0}

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
const escAttr=s=>esc(s).replace(/"/g,'&quot;');
const strip=v=>String(v||'').replace(/^["'\s]*\[*\s*|\s*\]*["'\s]*$/g,'');
const fname=p=>p.split('/').pop().replace(/\.md$/,'');
const fmOf=f=>f.frontmatter||{}, kundeVal=f=>strip(fmOf(f).kunde);
const isKundenTask=f=>!!kundeVal(f)||f.path.startsWith('09_aufgaben/kunden/');
/* mtime_ns (Editor-Konfliktschutz) ist eine Nanosekunden-Ganzzahl ueber 2^53 -- als Number verliert sie die
   letzten Stellen, und der Server meldete bei jedem Speichern „geaendert". Darum die Ziffern aus dem
   JSON-Quelltext behalten und unveraendert zurueckschicken; Browser ohne JSON.rawJSON bleiben bei der Zahl. */
const jsonMtime=t=>JSON.parse(t,(k,v,c)=>k==='mtime_ns'&&c&&c.source&&JSON.rawJSON?JSON.rawJSON(c.source):v);
const post=(u,d)=>fetch(u,{method:'POST',body:JSON.stringify(d)}).then(r=>r.text()).then(jsonMtime);
/* Seite selbst nicht zoombar (Pinch/Ctrl+Wheel) — nur die Agenten-Welt-Canvas zoomt eigenstaendig */
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
let M=null, AG={}, monTimer=null, POT=[], weltReady=false, curDept=null, deptRAF=null, hoverNode=null, TERM_EVENTS=[];
/* ---------- Zeichen-Drossel ----------
   Die Canvas-Schleifen liefen bisher unabhaengig davon, ob ihr Bild ueberhaupt jemand sieht:
   die Weltkarte zeichnete auch in Mail, Chat und Kalender weiter, die Sterne auch unter dem
   deckenden Abteilungs-Vollbild. Beides kostet GPU und zeigt niemandem etwas.
   `deptDeckendAb` faengt die Einblendung des Vollbilds ab -- waehrend der .26s Ueberblendung ist
   der Untergrund noch sichtbar und muss weiterlaufen, sonst friert er im Bild ein. */
let deptDeckendAb=0;
const deptDeckt=()=>{const ov=document.getElementById('deptOverlay');
  return !!ov&&!ov.hidden&&ov.classList.contains('show')&&performance.now()>=deptDeckendAb;};
const mapSichtbar=()=>!document.hidden&&!deptDeckt()
  &&document.getElementById('dashboard').classList.contains('on');
/* Ruhetakt ~30 Bilder/s. Der Strichfluss laeuft mit 26 px/s, das Atmen mit 1,3 Hz -- beides bleibt
   bei 30 fps fluessig. Waehrend echter Eingabe (Ziehen, Zoomen, Hover) wird ungebremst gezeichnet. */
const RUHE_MS=33, EINGABE_NACHLAUF=400;
let letzteEingabe=0;
['pointerdown','pointermove','wheel','keydown'].forEach(t=>
  addEventListener(t,()=>{letzteEingabe=performance.now();},{passive:true,capture:true}));
const eingabeAktiv=()=>performance.now()-letzteEingabe<EINGABE_NACHLAUF;
let GRAPH_KANTEN=[], GRAPH_INFO={};   /* echte [[Verweise]] aus /api/graph, gefuellt beim Boot */

/* Nachbarn eines Knotens, je Knoten gecacht -- bei jedem Frame neu zu suchen waere zu teuer */
const NACHBAR_CACHE=new WeakMap();
function dbNachbarn(kanten,k){
  let s=NACHBAR_CACHE.get(k);
  if(s)return s;

  kanten.forEach(([a,b])=>{if(a===k)s.add(b);else if(b===k)s.add(a);});

/* ---------- Abteilungen (Map) ----------
   Kommen aus 97_puoxos/abteilungen.json -- dort stehen Name, Farbe, Piktogramm, Beschreibung,

let ABT=[];                                   /* gefuellt beim Boot aus /api/abteilungen */
const abtVon=id=>ABT.find(a=>a.id===id);
/* agent-id -> Abteilungs-Id. Ein Agent kann in mehreren stehen; fuer die Farbe zaehlt der erste. */

function abtIndexBauen(){

const deptIdOf=id=>ABT.some(a=>a.id===id)?id:(ABT_VON_AGENT[id]||null);
/* "arbeitet gerade": mindestens ein Agent dieser Abteilung steht auf aktiv */

/* ---------- Burger-Menue: Position, Auf-/Zuklappen, Auto- oder Klick-Modus ---------- */
let burgerAuf=false,burgerTimer=null;
function burgerZu(){burgerAuf=false;$('#burger').classList.remove('auf');$('#burgermenu').classList.remove('auf');}

[$('#burger'),$('#burgermenu')].forEach(el=>{

function burgerStellen(){

     mittigem Burger steht sie rechts -- dort wandert sie IN die Kopfzeile neben das Zahnrad,

  const uhrLinks=CFG.menue==='burger'&&p==='rechts';
  const uhr=$('#kopfuhr');

  uhr.classList.toggle('links',uhrLinks);

    uhrLinks?ziel.insertBefore(uhr,ziel.firstElementChild):ziel.insertBefore(uhr,$('#gear'));}
  if(CFG.menue!=='burger')burgerZu();}

function agents(){
  const ex=M.files.filter(f=>f.path.startsWith('97_puoxos/agenten/')&&fmOf(f).typ==='agent'&&!f.path.includes('Vorlage'))
   .map(f=>{const m=fmOf(f);return{id:(m['agent-id']||fname(f.path)).toLowerCase(),name:fname(f.path),
     verb:m.aufgabe||'',akr:m.akronym||'',desc:m.beschreibung||'',art:m.art||'querschnitt',

/* ---------- Dashboard-Widgets ---------- */
/* Zeitzone und 12/24-h kommen aus den Einstellungen; "heute" ist der Tag IN dieser Zone --
   sonst springt der Kalender an der Tagesgrenze auf das falsche Datum. */
const TZ=()=>CFG.zeitzone||'Europe/Berlin';
const REG=()=>CFG.region||'de-DE';
const heute=()=>new Date().toLocaleDateString('sv',{timeZone:TZ()});
const zeitOpt=(sek)=>({timeZone:TZ(),hour:'2-digit',minute:'2-digit',...(sek?{second:'2-digit'}:{}),
  hour12:CFG.zeitformat==12});
const uhrText=(d,sek)=>d.toLocaleTimeString(REG(),zeitOpt(sek));
function tickClock(){const d=new Date();
  $('#clock').textContent=uhrText(d,true);
  $('#datum').textContent=d.toLocaleDateString(REG(),{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:TZ()});

setInterval(tickClock,1000);tickClock();
function renderTermine(){
  fetch('/api/termine').then(r=>r.json()).then(t=>{
    if(t.events===null){$('#termine').innerHTML=t.error?'<span class="warn">Kalender-Fehler: '+esc(t.error)+'</span>'
      :'<span class="muted">Kein Kalender verknüpft — im Kalender-Tab über „⚙ Kalender-Zugang“ einrichten</span>';return;}
    /* Ein kaputter Kalender kippt nicht die anderen: Fehler als Hinweis, gelieferte Termine trotzdem zeigen */
    const fehler=t.error?'<span class="warn">Kalender-Fehler: '+esc(t.error)+'</span>':'';

    $('#termine').innerHTML=fehler+(TERM_EVENTS.length?TERM_EVENTS.map((e,i)=>{const[d,u]=e.am.split(' ');
      return`<div${e.quelle==='lokal'?` class="lokal" data-ev="${i}"`:''}><b>${esc(d.slice(8)+'.'+d.slice(5,7)+'.')}${u?' '+esc(u):''}</b>${esc(e.was)}</div>`;}).join('')
      :fehler?'':'<span class="muted">keine anstehenden Termine</span>');
    $('#termine').querySelectorAll('div.lokal[data-ev]').forEach(el=>
      el.onclick=()=>editTerminOeffnen(TERM_EVENTS[+el.dataset.ev]));});}
const monthsSince=s=>{if(!/^\d{4}-\d\d-\d\d$/.test(s||''))return 0;
  const d=new Date(s+'T00:00:00'),n=new Date();
  let m=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());
  if(n.getDate()<d.getDate())m--;
  return Math.max(0,m);};
function renderWidgets(cfg){
  const K=M.files.filter(f=>f.path.startsWith('02_kunden/')&&fmOf(f).typ==='kunde'&&!f.path.includes('_kunden-vorlage')&&fmOf(f).status==='aktiv');
  $('#wKunden').textContent=K.length;
  const eur=n=>n.toLocaleString('de-DE')+' €';
  const monatseinkommen=K.reduce((s,f)=>s+(+fmOf(f).einkommen_monat_eur||0),0);
  const gesamtUmsatz=K.reduce((s,f)=>s+(+fmOf(f).einkommen_monat_eur||0)*monthsSince(fmOf(f).seit)+(+fmOf(f).einmalzahlungen_eur||0),0);
  $('#wEinkommen').textContent=monatseinkommen?eur(monatseinkommen):'–';
  $('#wEinkHint').textContent=monatseinkommen?'automatisch · Kunden-Frontmatter':'Kunden-Frontmatter pflegen (einkommen_monat_eur)';
  if(cfg.usage_limit_pct!=null){$('#usagePills').hidden=true;$('#wUsage').textContent=cfg.usage_limit_pct+' %';$('#wUsageHint').textContent='manuell (dashboard.json)';}
  else{$('#usagePills').hidden=false;
    /* gewaehltes Fenster behalten -- sonst stuende nach einem Nachladen die 7-Tage-Zahl unter „30 Tage" */
    const on=document.querySelector('#usagePills button.on');
    if(on&&on.dataset.w!=='7d')on.onclick();else paintUsage(cfg.usage_tokens,'Tokens · letzte 7 Tage');}
  const ziel=cfg.ziel_eur||1e5, pct=Math.min(100,100*gesamtUmsatz/ziel);
  $('#roadfill').style.width=pct+'%';
  $('#roadlabel').textContent=`Road to ${ziel.toLocaleString('de-DE')} € (${pct.toFixed(1)} %)`;}

/* ---------- Pan/Zoom-Hilfsfunktion (geteilt: Agenten-Welt + Agenten-Stammbaum) ---------- */
const EDGES=[];   /* Agenten-Hierarchie: [eltern-id, kind-id]-Paare aus agenten/*.md, z. B. ['chef','helfer'] */
/* ---------- Freiraum hinter den festen Beschriftungen ----------
   Uhr, Datum, Termine, Kunden, Einkommen, Usage und Road-to sind fest positionierter Text ueber der
   Karte. Wo Kartenlinien dahinterlaufen, wird der Text unleserlich. Statt die Widgets mit einer
   Flaeche zu hinterlegen (das verdeckt die Karte dauerhaft), wird die Karte an genau diesen Stellen
   ausgestanzt: `destination-out` loescht das bereits Gezeichnete. Der Rand laeuft ueber mehrere
   Ringe weich aus, damit keine sichtbare Kante entsteht. */
const FREIRAUM_SEL='#dashboard .col .w, #dashboard .col .row, #road';
/* Nur die tatsaechlichen Textzeilen freistellen, nicht den ganzen Widget-Kasten: ein Range ueber
   den Textknoten liefert mit getClientRects() genau die belegten Zeilen. Leerraum im Widget
   (etwa unter einer kurzen Terminliste) bleibt dadurch Karte. */
function textZeilen(el){
  const raus=[];
  const lauf=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{
    acceptNode:n=>n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const bereich=document.createRange();
  let n;
  while(n=lauf.nextNode()){
    bereich.selectNodeContents(n);
    for(const r of bereich.getClientRects())
      if(r.width>1&&r.height>1)raus.push(r);}
  /* Bedienelemente (Knoepfe, Eingaben, Farbflaechen) zaehlen als Ganzes, nicht nur ihr Text */
  el.querySelectorAll('button,input,select,svg,.ring,.badge,.chip').forEach(b=>{
    const r=b.getBoundingClientRect();
    if(r.width>1&&r.height>1)raus.push(r);});
  return raus;}
function freiraumStanzen(ctx,cv,w,h){
  const rc=cv.getBoundingClientRect();
  const alt=ctx.globalCompositeOperation;
  ctx.globalCompositeOperation='destination-out';
  document.querySelectorAll(FREIRAUM_SEL).forEach(el=>{
    const b=el.getBoundingClientRect();
    if(!b.width||!b.height)return;
    textZeilen(el).forEach(r=>{
      const x=r.left-rc.left, y=r.top-rc.top;
      /* Weicher Auslauf von innen nach aussen; 5 px Luft rundum, damit Buchstabenraender frei sind */
      for(let i=6;i>=1;i--){
        const p=i/6, auf=5+7*p;
        ctx.globalAlpha=(1-p)*0.34+(i===1?0.70:0);
        ctx.beginPath();
        rundRect(ctx,x-auf,y-auf,r.width+auf*2,r.height+auf*2,6+auf*.7);
        ctx.fill();}});
  });
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation=alt;}
function rundRect(ctx,x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();}

function attachPanZoom(cv,cam,{draw,pick,onClick,signal}){
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    const rc=cv.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top,w=rc.width,h=rc.height;
    const wx=(mx-w/2)/cam.scale+cam.x, wy=(my-h/2)/cam.scale+cam.y;
    cam.scale=Math.max(cam.min,Math.min(cam.max,cam.scale*Math.exp(-e.deltaY*.0012)));
    cam.x=wx-(mx-w/2)/cam.scale;cam.y=wy-(my-h/2)/cam.scale;
    draw();},{passive:false,signal});
  let drag=null,moved=false;
  cv.onpointerdown=e=>{
    if(e.button)return;
    drag={cx:cam.x,cy:cam.y,mx:e.clientX,my:e.clientY};moved=false;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}  /* ohne Capture endet das Ziehen am Canvas-Rand */
    cv.style.cursor='grabbing';e.preventDefault();};
  cv.onpointermove=e=>{if(!drag){cv.style.cursor=pick(e)?'pointer':'grab';return;}
    const dx=e.clientX-drag.mx,dy=e.clientY-drag.my;
    if(Math.hypot(dx,dy)>4)moved=true;
    cam.x=drag.cx-dx/cam.scale;cam.y=drag.cy-dy/cam.scale;draw();};
  /* Auch bei verlorenem Zeiger sauber beenden -- sonst haengt die Karte am Mauszeiger fest */
  const stop=e=>{if(drag&&!moved&&e&&e.type==='pointerup'){const n=pick(e);if(n)onClick(n);}
    drag=null;cv.style.cursor='grab';};
  cv.onpointerup=stop;cv.onpointercancel=stop;cv.onlostpointercapture=stop;
  cv.ondragstart=e=>e.preventDefault();
}
/* ---------- Map: Zentrum = Wissensdatenbank, aussen die Abteilungen ---------- */
let DEPTS=[];   /* Abteilungs-Ids, Reihenfolge wie in abteilungen.json */
/* Ringmasse der Haupt-Map. Von innen nach aussen: Wissensdatenbank (bleibt INNERHALB von R1 --
   siehe DB_RAD_AUF), Abteilungs-Piktogramme auf R1, danach die Arme in drei Stufen, ganz aussen
   die grossen Abteilungs-Labels auf RLAB. */
const R1=150,ARM1=58,ARM2=38,RLAB=380;
/* Zwei Stellschrauben fuer die Optik der ganzen Karte, damit "10 % kleiner" / "halb so dick"
   an EINER Stelle steht statt an acht: PKT_KLEIN skaliert jeden Punkt, LIN_DUENN jede Linie.
   Die Abteilungs-Piktogramme sind davon ausgenommen -- sie sind Zeichen, keine Punkte. */
const PKT_KLEIN=.9, LIN_DUENN=.5;
function forestOf(A){
  const byId={};A.forEach(a=>byId[a.id]=a);
  const parentOf={},childrenOf={};
  EDGES.forEach(([p,c])=>{if(byId[p]&&byId[c]&&!(c in parentOf)){parentOf[c]=p;(childrenOf[p]=childrenOf[p]||[]).push(c);}});
  return{byId,parentOf,childrenOf};
}
const kidsOf=(childrenOf,id)=>(childrenOf[id]||[]).filter(c=>!DEPTS.includes(c));
function subtreeAll(id,childrenOf){const out=[];(function dfs(x){kidsOf(childrenOf,x).forEach(c=>{out.push(c);dfs(c);});})(id);return out;}

/* Zentrum = die echte Wissensdatenbank: ein Punkt je Datei aus dem Manifest, Farbe nach Top-Ordner.
   Position deterministisch aus dem Pfad-Hash -- gleiche Datei liegt nach jedem Reload am selben Fleck. */
const FOLDCOL={'01_unternehmen':'#66B8FF','02_kunden':'#FF8FB1','03_Projekte':'#FFC24D','04_systeme':'#4DD9E8',
 '05_sicherheit-dsgvo':'#FF6B6B','07_automation':'#A3E635','08_ideen':'#B18CFF','09_aufgaben':'#21F1A8',

   Jetzt kommen die Kanten aus /api/graph (echte [[Verweise]]) und ein kraftbasiertes Layout
   zieht Verbundenes zusammen. Deterministischer Seed: dieselbe DB sieht nach jedem Laden gleich aus.
   Grenze: Aus Dateien mit `ki_freigabe: gesperrt` werden keine AUSGEHENDEN Links gelesen
   (Sperrzonen) -- sie haengen nur an dem, was auf sie zeigt. */
/* Radius zusammengezogen (Uebersicht) vs. aufgefaechert (drin). DB_RAD_AUF liegt bewusst unter

const DB_RAD_ZU=34, DB_RAD_AUF=112;

function makeDBCloud(files,kanten){
  const knoten=files.map(f=>{
    const h=hash32(f.path);
    return{path:f.path,name:fname(f.path),gesperrt:!!f.gesperrt,
      col:folderCol(f.path),ph:(h%628)/100,h,
      grad:0,x:0,y:0,vx:0,vy:0};});

/* Kraftbasiertes Layout (Fruchterman-Reingold, gedaempft). Laeuft einmal beim Laden --

function layoutGraph(knoten,kanten){
  const n=knoten.length;if(!n)return;
  const rnd=mulberry32(20260814);
  /* Start: verbundene Knoten innen, unverbundene aussen -- so muss die Simulation weniger schieben */
  knoten.forEach(k=>{
    const a=rnd()*Math.PI*2, r=(k.grad?0.55:0.95)*Math.sqrt(rnd())*DB_RAD_AUF;
    k.x=Math.cos(a)*r;k.y=Math.sin(a)*r;});

  const kMax=Math.sqrt(flaeche/n)*0.72;      /* Idealabstand */

  for(let s=0;s<SCHRITTE;s++){
    knoten.forEach(k=>{k.vx=0;k.vy=0;});
    /* Abstossung: nur gegen Nachbarn im Raster statt gegen alle -- sonst waeren das
       bei 500 Knoten 250.000 Vergleiche je Schritt */
    const zell=kMax*2, raster={};
    knoten.forEach(k=>{
      const cx=Math.round(k.x/zell),cy=Math.round(k.y/zell);
      (raster[cx+','+cy]=raster[cx+','+cy]||[]).push(k);});
    knoten.forEach(k=>{
      const cx=Math.round(k.x/zell),cy=Math.round(k.y/zell);
      for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
        const zelle=raster[(cx+dx)+','+(cy+dy)];
        if(!zelle)continue;
        zelle.forEach(m=>{
          if(m===k)return;
          let ex=k.x-m.x,ey=k.y-m.y,d2=ex*ex+ey*ey;
          if(d2<0.01){ex=(rnd()-0.5)*0.6;ey=(rnd()-0.5)*0.6;d2=ex*ex+ey*ey;}
          const d=Math.sqrt(d2),f=kMax*kMax/d2;
          k.vx+=ex/d*f;k.vy+=ey/d*f;});}});
    /* Anziehung entlang der Kanten */
    kanten.forEach(([a,b])=>{
      const ex=a.x-b.x,ey=a.y-b.y,d=Math.hypot(ex,ey)||0.01;
      const f=d*d/kMax;
      const fx=ex/d*f,fy=ey/d*f;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;});
    /* Schritt begrenzen (Temperatur) und sanft zur Mitte ziehen, damit nichts wegdriftet */
    knoten.forEach(k=>{
      const d=Math.hypot(k.vx,k.vy)||0.01;
      const s2=Math.min(d,temp);
      k.x+=k.vx/d*s2;k.y+=k.vy/d*s2;
      k.x*=0.998;k.y*=0.998;});

  let max=1;knoten.forEach(k=>{max=Math.max(max,Math.hypot(k.x,k.y));});
  const f=DB_RAD_AUF/max;
  knoten.forEach(k=>{
    k.x*=f;k.y*=f;
    /* Radius nach Verbindungsgrad -- stark Verlinktes faellt auf, wie in Obsidian.
       PKT_KLEIN haelt alle Punkte der Karte auf demselben Massstab. */
    k.r=(1.1+Math.min(3.4,Math.sqrt(k.grad)*0.85))*PKT_KLEIN;});}

   pro Bild, pro Canvas, obwohl sich am Raster nie etwas aendert. Es wird jetzt einmal je
   Canvas-Groesse vorgerendert und danach 1:1 hineinkopiert.

  let cx=x-total/2;ctx.textAlign='left';
  chars.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=widths[i]+ls;});
  ctx.restore();}

      ctx.beginPath();ctx.moveTo(k*.2,-k*.9);ctx.lineTo(k*.9,-k*.2);ctx.lineTo(k*.62,-k*.62);
      ctx.closePath();ctx.stroke();

/* Referenz-Optik: Abteilungs-Knoten sind dunkle Scheiben mit farbigem Ring + farbigem Icon.

function drawHub(ctx,x,y,r,col,label,filled,alpha,subtitle,withName){

    ctx.fillStyle='#E9E3D5';

    if(subtitle){ctx.globalAlpha=alpha*.6;ctx.fillStyle='#8f8f83';ctx.font='9px system-ui';ctx.textAlign='center';
      ctx.fillText(subtitle,x,y+r+28);}}
  ctx.globalAlpha=1;}

/* Weiche Kamerafahrt -- traegt die Morph-/Parallax-Bewegung beim Oeffnen einer Abteilung */
function camTween(cam,to,dur,draw,after){
  const from={x:cam.x,y:cam.y,scale:cam.scale},t0=performance.now();
  (function step(){
    const p=Math.min(1,(performance.now()-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    cam.x=from.x+(to.x-from.x)*e;cam.y=from.y+(to.y-from.y)*e;
    cam.scale=from.scale*Math.pow(to.scale/from.scale,e);

      const arbeitet=kind==='hub'&&abtAktiv(b.id);

    return g.nodes.find(nd=>!(nd.id==='db'&&DB_IN(cam.scale))

    if(n.id==='db'){                                    /* Mitte: hineinzoomen statt sofort Datei oeffnen */
      if(DB_IN(cam.scale))openEditor(n.file);
      else camTween(cam,{x:0,y:0,scale:home.scale*4.2},650,draw);

/* ---------- Abteilungs-Drilldown: Vollbild je Abteilung ----------
   Referenz-Aufbau: die Abteilung sitzt unten in der Mitte, je Zustaendigkeit waechst eine Kette
   aus ihren Stationen nach oben, und der Name der Zustaendigkeit steht als Gruppen-Label am
   aeusseren Ende dieser Kette. Die Agenten stehen im Panel links. */
const GLYPHEN=['g1','g2','g3','g4','g5','g6'];
function deptLayout(id){
  const a0=abtVon(id)||{};
  const hub={id,label:a0.name||id,verb:a0.kurz||'',icon:a0.icon,r:17,wx:0,wy:300,ishub:true};
  const nodes=[hub],links=[],gruppen=[];
  const zus=a0.zustaendigkeiten||[];
  const rnd=mulberry32(hash32(id));
  const n=Math.max(1,zus.length),spann=Math.PI*.88;
  zus.forEach((z,i)=>{
    /* Faecher nach oben: -90 Grad ist senkrecht, spann verteilt die Ketten darum herum */
    let a=-Math.PI/2-spann/2+(i+.5)/n*spann,r=0,vor=hub;
    const st=(z.stationen||[]).length?z.stationen:[z.was];
    st.forEach((s,j)=>{
      a+=(rnd()-.5)*.2;r+=(j?78:150)+(rnd()-.5)*26;
      const nd={id:id+'#'+i+'.'+j,label:s,zus:z,r:j?8:9.5,glyph:GLYPHEN[hash32(s)%GLYPHEN.length],
        wx:hub.wx+Math.cos(a)*r,wy:hub.wy+Math.sin(a)*r,ph:(i*7+j)*2.399963};
      nodes.push(nd);links.push([vor,nd]);vor=nd;});
    gruppen.push({zus:z,label:z.was,n:(z.stationen||[]).length,
      wx:hub.wx+Math.cos(a)*(r+72),wy:hub.wy+Math.sin(a)*(r+72)});});
  return{nodes,links,gruppen,hub};
}
function closeDept(){
  const ov=$('#deptOverlay');
  ov.classList.remove('show');curDept=null;
  if(deptRAF)cancelAnimationFrame(deptRAF);
  setTimeout(()=>{if(!ov.classList.contains('show'))ov.hidden=true;},300);}
function openDept(id,zusFokus){
  const ov=$('#deptOverlay');
  /* Reflow erzwingen statt auf einen Frame zu warten -- rAF ruht in Hintergrund-Tabs,
     das Overlay wuerde sonst unsichtbar ueber der Seite haengen */
  curDept=id;ov.hidden=false;void ov.offsetWidth;ov.classList.add('show');

     und Sterne dahinter sichtbar und muessen weiterzeichnen, sonst frieren sie im Bild ein. */
  deptDeckendAb=performance.now()+300;
  const g=deptLayout(id),a=abtVon(id)||{};
  $('#deptTitle').textContent=(a.name||id).toUpperCase();
  $('#deptSub').textContent=a.kurz||'';
  const nZus=(a.zustaendigkeiten||[]).length;
  const nSt=(a.zustaendigkeiten||[]).reduce((s,z)=>s+(z.stationen||[]).length,0);
  $('#deptCount').textContent=`${nZus} Zuständigkeiten · ${nSt} Stationen`;
  const idx=DEPTS.indexOf(id),prev=DEPTS[(idx-1+DEPTS.length)%DEPTS.length],next=DEPTS[(idx+1)%DEPTS.length];
  $('#deptPrevLbl').textContent=(abtVon(prev)||{}).name||prev||'';
  $('#deptNextLbl').textContent=(abtVon(next)||{}).name||next||'';

  if(zusFokus)openAbteilungPanel(id,zusFokus);else hidePanel('#apanel');

$('#deptBack').onclick=closeDept;
/* Panel links: Beschreibung, Zustaendigkeiten mit Stationen, und die Agenten der Abteilung */
function openAbteilungPanel(id,zusFokus){

  $('#mstatus').className='badge';

  $('#pchildren').className='';

    <details class="zus"${zusFokus&&zusFokus.was===z.was?' open':''}>

  fit();addEventListener('resize',()=>{if(!$('#deptOverlay').hidden)fit();},{signal});
  /* Gleiche Drossel wie bei der Weltkarte: waehrend der Ein-/Ausblendung und bei echter Eingabe
     volle Rate, in Ruhe ~30 Bilder/s. Der Loop endet ohnehin mit `closeDept` (cancelAnimationFrame). */
  let letzterFrame=0;
  deptRAF=requestAnimationFrame(function loop(now){   /* ID sofort merken -- sonst laeuft der Loop weiter,
                                                         wenn closeDept vor dem ersten Bild zuschlaegt */
    deptRAF=requestAnimationFrame(loop);
    if(document.hidden)return;
    if(!eingabeAktiv()&&(now-letzterFrame)<RUHE_MS)return;
    letzterFrame=now;
    draw();});
}

const PAL=['#21F1A8','#66B8FF','#FFC24D','#B18CFF','#4DD9E8','#A3E635','#FF6B6B','#d8b35a'];
function pieSVG(items,kind){
  if(!items.length)return'';
  /* Ein einziger Eintrag mit Anteil (Rest 0) ist 100 %: ein Bogen von 360 Grad endet auf seinem
     Startpunkt und zeichnet nichts -- darum auch dann den Vollkreis */
  const mitAnteil=items.filter(i=>i.val>0);
  if(items.length===1||mitAnteil.length===1){const it=mitAnteil[0]||items[0];
    return`<svg viewBox="0 0 200 200"><circle class="dseg" data-kind="${kind}" data-name="${escAttr(it.name)}" cx="100" cy="100" r="98" fill="${it.color}"><title>${esc(it.name)} — 100%</title></circle></svg>`;}
  const r=98,total=items.reduce((s,i)=>s+i.val,0)||1;let ang=-90;
  const pt=(a,rad)=>[100+rad*Math.cos(a*Math.PI/180),100+rad*Math.sin(a*Math.PI/180)];
  return`<svg viewBox="0 0 200 200">${items.map(it=>{
    const sweep=it.val/total*360,a0=ang,a1=ang+sweep;ang=a1;
    const[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r),large=sweep>180?1:0;
    const d=`M100,100 L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    return`<path class="dseg" data-kind="${kind}" data-name="${escAttr(it.name)}" d="${d}" fill="${it.color}"><title>${esc(it.name)} — ${(100*it.val/total).toFixed(0)}%</title></path>`;}).join('')}</svg>`;}
function legendHTML(items,unit,kind){const total=items.reduce((s,i)=>s+i.val,0)||1;
  return `<div class="dlegend">${items.map(it=>`<div data-kind="${kind}" data-name="${escAttr(it.name)}"><span class="sw" style="background:${it.color}"></span>${esc(it.name)} — ${(100*it.val/total).toFixed(0)}%${unit?' · '+it.val+unit:''}</div>`).join('')}</div>`;}

/* ---------- Markdown-Vorschau + [[Wikilinks]] + Backlinks (der Obsidian-Teil im Panel) ---------- */
/* inline() maskiert vor der Link-Suche -- ohne Rueckweg fand [[notizen-&-ideen]] seine Datei nie */
const unesc=s=>String(s).replace(/&(lt|gt|amp|quot|apos);/g,(x,e)=>({lt:'<',gt:'>',amp:'&',quot:'"',apos:"'"})[e]);
const resolveLink=name=>{const n=unesc(name).trim().toLowerCase();
  const f=(M?.files||[]).find(x=>fname(x.path).toLowerCase()===n)
        ||(M?.files||[]).find(x=>x.path.toLowerCase().endsWith('/'+n+'.md'));
  return f?f.path:null;};
function mdRender(src){
  const raw=String(src||'');let body=raw,fm='';
  const f=raw.match(/^---\n([\s\S]*?)\n---\n?/);
  if(f){fm=f[1];body=raw.slice(f[0].length);}
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g,(x,t,al)=>{
      const p=resolveLink(t);
      return`<a href="#" class="wl${p?'':' miss'}" data-l="${(p||'').replace(/"/g,'&quot;')}">${(al||t).trim()}</a>`;})
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[];let code=false,list=null,tab=null,mm;
  /* Tabellen: Kopfzeile + Trennzeile |---|. Zellen trennt ein | ohne Backslash davor -- `\|` (z. B. im Wikilink-Alias)
     bleibt Teil der Zelle. Bewusst schlicht: kein | in Inline-Code, keine Spaltenausrichtung; beides traegt Obsidian. */
  const zellen=l=>l.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>inline(c.trim().replace(/\\\|/g,'|')));
  const closeList=()=>{if(list){out.push('</'+list+'>');list=null;}
    if(tab){out.push('<table class="mdtab"><thead><tr>'+tab.kopf.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+
      tab.zeilen.map(z=>'<tr>'+z.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>');tab=null;}};
  const TRENN=/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/;
  body.split('\n').forEach((l,i,L)=>{
    if(/^```/.test(l)){closeList();out.push(code?'</pre>':'<pre>');code=!code;return;}
    if(code){out.push(esc(l));return;}
    if(!l.trim()){closeList();return;}
    if(mm=l.match(/^(#{1,6})\s+(.*)$/)){closeList();out.push(`<h${mm[1].length}>${inline(mm[2])}</h${mm[1].length}>`);return;}
    if(/^(---|\*\*\*|___)\s*$/.test(l)){closeList();out.push('<hr>');return;}
    if(mm=l.match(/^\s*[-*+]\s+(.*)$/)){if(list!=='ul'){closeList();out.push('<ul>');list='ul';}
      out.push('<li>'+inline(mm[1])+'</li>');return;}
    if(mm=l.match(/^\s*\d+[.)]\s+(.*)$/)){if(list!=='ol'){closeList();out.push('<ol>');list='ol';}
      out.push('<li>'+inline(mm[1])+'</li>');return;}
    if(mm=l.match(/^>\s?(.*)$/)){closeList();out.push('<blockquote>'+inline(mm[1])+'</blockquote>');return;}
    if(/^\|/.test(l)){
      if(tab){if(tab.trenn){tab.trenn=false;return;}tab.zeilen.push(zellen(l));return;}
      closeList();
      if(TRENN.test(L[i+1]||'')){tab={kopf:zellen(l),zeilen:[],trenn:true};return;}
      out.push('<div class="mdrow">'+inline(l)+'</div>');return;}
    closeList();out.push('<p>'+inline(l)+'</p>');});
  closeList();if(code)out.push('</pre>');
  return(fm?`<div class="mdfm">${esc(fm)}</div>`:'')+out.join('\n');}
function bindLinks(root){root.querySelectorAll('a.wl,a[data-p]').forEach(a=>a.onclick=e=>{
  e.preventDefault();const p=a.dataset.l||a.dataset.p;if(p)openEditor(p);});}

  $('#tBackSec').hidden=false;$('#tBack').innerHTML='<span class="muted" style="font-size:11px">suche …</span>';
  fetch('/api/backlinks?p='+encodeURIComponent(path)).then(r=>r.json()).then(b=>{

    .catch(()=>{if(editPath===path)$('#tmsg').textContent='Laden fehlgeschlagen';});
  loadBacklinks(path);}

/* Einladung als .ics -- reine Textdatei, komplett im Browser gebaut */
function terminIcsLaden(t){
  const stamp=s=>(s||'').replace(/[-:]/g,'').replace('T','T')+((s||'').length>10?'00':'');
  /* DTEND ist exklusiv und hat denselben Typ wie DTSTART (RFC 5545): ganztaegig = Folgetag des Endes,
     ein Enddatum ohne Uhrzeit bei Termin mit Uhrzeit = Folgetag 00:00 */
  const ganz=(t.beginn||'').length<=10;
  const folgetag=s=>{const d=new Date(s.slice(0,10)+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);};
  const zeilen=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//puox//97_puoxos//DE','BEGIN:VEVENT',
    'UID:'+Date.now()+'@puox-os','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    !ganz?'DTSTART:'+stamp(t.beginn):'DTSTART;VALUE=DATE:'+stamp(t.beginn),
    ...(t.ende?[(ganz?'DTEND;VALUE=DATE:'+stamp(folgetag(t.ende))
      :'DTEND:'+stamp(t.ende.length>10?t.ende:folgetag(t.ende)+'T00:00'))]:[]),
    'SUMMARY:'+(t.titel||'').replace(/[\r\n,;]/g,' '),
    ...(t.ort?['LOCATION:'+t.ort.replace(/[\r\n,;]/g,' ')]:[]),
    ...(t.beschreibung?['DESCRIPTION:'+t.beschreibung.replace(/[\r\n]+/g,'\\n').replace(/[,;]/g,' ')]:[]),
    ...(t.teilnehmer||'').split(',').map(s=>s.trim()).filter(Boolean).map(a=>'ATTENDEE;RSVP=TRUE:mailto:'+a),
    'END:VEVENT','END:VCALENDAR'];
  const b=new Blob([zeilen.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=((t.titel||'termin').replace(/[^\w\-]+/g,'_').slice(0,40))+'.ics';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
